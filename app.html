<!DOCTYPE html>
<!--
=====================================================================
 PRICECOM — INSTRUCTIONS FOR AI  (คู่มือสำหรับ AI: อ่านส่วนนี้ก่อน)
=====================================================================
WHAT THIS FILE IS
  A single-file, offline web app (open it in any browser) that compares the
  price of the same items across several stores, in Thai baht (THB).
  It shows each store's total, the best single store, the cheapest
  multi-store basket (Lens L1/L2/L3) and how every option compares with a budget.
  Data is saved in the browser (localStorage). Nothing is sent anywhere.

IF A USER JUST SHARED THIS FILE WITH YOU (chat assistants: start here)
  The user wants to use this app to compare prices. Unless they already said
  what they want, ask in one short message:
    - what items to compare (e.g. a PC build, groceries, a trip),
    - which stores or sites (or offer to choose common ones),
    - an optional budget.
  Then find real prices with sources and deliver them through the best route
  below: A if you can create or edit files (return the filled .html so the user
  can open it), otherwise C. The user's own request always comes first.

CHOOSE THE ROUTE THAT MATCHES WHAT YOU CAN DO
  A) You can EDIT THIS FILE (file tools, code interpreter, a code editor):
     Directly below this comment, inside <head>, is a <script> element of type
     application/json whose id is pricecom-data. Replace ONLY the JSON between its
     opening and closing tags with data in the DATA FORMAT below. Return the file.
     With Python this is one step (copy as is):
       import json, re
       tag = '<script type="application/json" id="' + 'pricecom' + '-data">'
       html = open('pricecom.html', encoding='utf-8').read()
       body = json.dumps(DATA, ensure_ascii=False).replace('<' + '/', '<' + '\\/')
       i = html.index(tag) + len(tag); j = html.index('<' + '/script>', i)
       open('pricecom-filled.html', 'w', encoding='utf-8').write(html[:i] + '\n' + body + '\n' + html[j:])
     (DATA is a Python dict in the DATA FORMAT below.)
     When the user opens it, the data is imported once as a new sheet
     (the same content is never imported twice in the same browser).
     Keep it valid JSON (no comments) and write any "</" inside strings as "<\/".
     Do not change anything else in the file.
  B) You control a BROWSER that has this page open (you can run JavaScript):
     Call window.PriceCom.help() to get this text, then for example:
       PriceCom.import({...DATA FORMAT...}, {target:'new'})   // returns stats
       PriceCom.setPrice('CPU Ryzen 5 7600','JIB',6890,{source:'https://...',checked:'2026-10-11'})
       PriceCom.results()                                      // totals, best value, lens baskets
       PriceCom.lens(2,{n:3})                                  // best basket using at most 3 stores
     Full API: listSheets() · getSheet(name?) · results(name?) · createSheet(name) ·
       openSheet(name) · import(jsonOrText,{target:'current'|'new',overwrite:false}) ·
       setPrice(item,store,value,{source,checked,group}) · setBudget(amount) ·
       lens(1|2|3,{n,stores:[names]}) · undo()
  C) You can only CHAT: reply with JSON in the DATA FORMAT. The user pastes it
     into  File → Import from AI…  (ไฟล์ → นำเข้าจาก AI…).
     Markdown tables and CSV (first column = item, other columns = stores) also work.

DATA FORMAT  (PriceCom JSON v1)
  {
    "pricecom": 1,
    "sheet": "PC build",                       // sheet name (optional)
    "stores": ["JIB", "Advice"],               // optional; column order
    "items": [
      { "name": "CPU AMD Ryzen 5 7600", "group": "Core",
        "prices": {
          "JIB":    { "value": 6890, "source": "https://...", "checked": "2026-10-11" },
          "Advice": { "value": null, "source": null, "checked": null }
        } },
      { "name": "Shipping", "group": "Fees",
        "prices": { "JIB": { "value": 0, "source": "https://...", "checked": "2026-10-11" } } }
    ]
  }

RULES  (important — the app shows which numbers came from AI)
  1. Only include prices you actually verified. Every price needs "source" (URL of
     the product page) and "checked" (YYYY-MM-DD). Prices without a source are
     flagged orange in the app as "verify before trusting".
  2. If you cannot find or are unsure of a price, use null. NEVER guess or invent.
  3. "value": THB, digits only, no commas or currency signs. A unit price may be
     written "price/quantity", e.g. "199/800". Expressions like "6500+120" work too.
  4. Missing price (null / omitted) = this store does not sell the item.
     0 = free (e.g. free shipping). Put shipping and fees as their own items.
  5. When adding to an existing sheet, reuse the exact item and store names.
     Matching ignores upper/lower case; unknown names create new rows/columns.
  6. Existing prices are NOT overwritten unless overwrite:true is passed.

HOW THE RESULTS ARE CALCULATED  (so you can explain them to the user)
  - Store total   = sum of that store's prices.
  - Best value    = lowest total among stores that price EVERY item
                    (a store with missing items is never "best").
  - Lens L1       = cheapest price of each item across all stores, summed.
  - Lens L2       = tries every set of at most n stores; keeps the set that covers
                    the most items, then the cheapest one.
  - Lens L3       = like L1, but only among the stores the user picked.
  - Budget view   = each lens/store total minus the budget, in baht and in %.
  - Every number can be clicked to highlight the source cells it came from.

DO NOT
  - Do not remove or edit the scripts, styles or embedded fonts; the file must stay
    self-contained and work offline.
=====================================================================
-->
<html lang="th">
<head>
<meta charset="utf-8">
<script type="application/json" id="pricecom-data">
{"pricecom":1,"sheet":null,"stores":[],"items":[]}
</script>
<meta name="description" content="PriceCom: offline multi-store price comparison app. AI agents: read the HTML comment at the top of this file, or call window.PriceCom.help().">

<title>PriceCom — เทียบคอม</title>

/* ---------- spreadsheet grid ---------- */

.lbl{display:inline-flex;align-items:center;gap:3px;height:20px;padding:0 6px;border-radius:6px;font-size:11px;font-weight:600;background:var(--sc-high);color:var(--on-surface-var);white-space:nowrap}
.lbl .i{width:13px;height:13px}
.lbl.base{background:var(--primary-container);color:var(--on-primary-container)}
.lbl.warn{background:var(--warn-container);color:var(--warn)}
.lbl.good{background:var(--success-container);color:var(--success)}
.headlabel{padding:6px 12px;font-size:12px;color:var(--on-surface-var);font-weight:500}
.namecell{display:flex;align-items:center;height:var(--rowH);padding:0 2px 0 8px;gap:2px}
.namecell .name{flex:1;height:28px;padding:0 4px;border-radius:4px;font-size:13.5px}
.namecell .name:focus{box-shadow:inset 0 0 0 2px var(--sel);background:var(--surface)}
.namecell .rm{opacity:0}
tr:hover .namecell .rm,.namecell:focus-within .rm{opacity:1}
.chev{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:var(--on-surface-var);flex:none}
.chev:hover{background:var(--state-hover)}
.chev .i{transition:transform .15s}.chev.closed .i{transform:rotate(-90deg)}
tr.group td,tr.group .g-name{background:var(--sc)}
tr.group .name{font-weight:600}
tr.group .g-base{background:var(--sc)}
.cell{display:block;width:100%;height:var(--rowH);padding:0 10px;text-align:right;font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums;color:var(--on-surface)}
td.sel{box-shadow:inset 0 0 0 2px var(--sel)!important}
td.sel .cell{background:transparent}
/* highlight = marker behind the number only (like a text selection), not the whole cell */
td.hl .cell{background:linear-gradient(var(--hl-mark),var(--hl-mark)) no-repeat right 7px center/calc(var(--hlw,0px) + 6px) 20px;color:#1f1f1f}
td.match.hl .cell{background:none;color:inherit}
td.hl:not(.match) .rv .v{background:var(--hl-mark);color:#1f1f1f;padding:0 3px;margin-right:-3px;border-radius:2px}
td.err .cell{color:var(--error);text-decoration:underline wavy var(--error) 1px;text-underline-offset:3px}
td.match,th.match .colbody{background:var(--primary-container)!important}
.sg tbody .g-base{background:var(--base-bg)}
.sg tbody tr.group .g-base{background:var(--base-group)}
.sg.res .g-name{left:0}
tr.drop>*{box-shadow:inset 0 2px 0 var(--primary)}
th.drop{box-shadow:inset 3px 0 0 var(--primary)}
.gridfoot{display:flex;gap:8px;align-items:center;padding:10px 12px;border-top:1px solid var(--grid);background:var(--surface);flex:none;flex-wrap:wrap}
.gridfoot .hint{color:var(--on-surface-var);font-size:12.5px;margin-left:auto;max-width:720px}
code{font-family:var(--mono);font-size:12px;background:var(--sc-high);padding:1px 5px;border-radius:4px}

/* results table */
.sg.res td{height:60px;padding:6px 12px;vertical-align:top}
.sg.res thead th{padding:0}
.sg.res td.g-name{padding:8px 12px;font-size:13.5px}
.sg.res tr.group td.g-name{font-weight:600}
.rv{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.rv .v{font-family:var(--mono);font-size:13.5px}
.rv .v.dim{color:var(--on-surface-var)}
.rv .rate{font-size:11px;color:var(--on-surface-var);font-family:var(--mono)}
tr.group .rv .v{font-weight:600}
.dchip{font-family:var(--mono);font-size:11px;font-weight:600;padding:1px 6px;border-radius:6px;white-space:nowrap}
.dchip.up{background:var(--error-container);color:var(--error)}
.dchip.down{background:var(--success-container);color:var(--success)}
.dchip.flat,.dchip.na{background:var(--sc-high);color:var(--on-surface-var)}
.dchip.base{background:var(--primary-container);color:var(--on-primary-container)}
.rhead{padding:8px 12px;display:flex;flex-direction:column;align-items:flex-end;gap:2px;min-height:76px}
.rhead .nm{font-weight:600;font-size:13px;text-align:right}
.rhead .tt{font-family:var(--mono);font-size:13px;font-weight:600}
.rhead .pc{font-size:11.5px;font-family:var(--mono)}
.rhead .pc.up{color:var(--error)}.rhead .pc.down{color:var(--success)}
th.bestcol .rhead{box-shadow:inset 0 3px 0 var(--success);background:color-mix(in srgb,var(--success-container) 45%,var(--grid-head))}

/* ---------- cards / charts / lens ---------- */
.card{background:var(--surface);border:1px solid var(--outline-var);border-radius:16px;padding:20px 24px;margin-bottom:16px}
.card h2{font-size:18px;font-weight:500;margin:0 0 2px}
.card .sub{color:var(--on-surface-var);font-size:13px;margin:0 0 16px}
.notice{display:flex;gap:10px;align-items:flex-start;border-radius:12px;padding:12px 16px;background:var(--warn-container);color:var(--warn);font-size:13px;margin:12px 0}
.notice.info{background:var(--sc-high);color:var(--on-surface-var)}
.bar{display:grid;grid-template-columns:minmax(90px,180px) 1fr auto;gap:12px;align-items:center;margin:6px 0;font-size:13px}
.bar .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:4px}
.bar .track{height:20px;position:relative}
.bar .fill{height:100%;background:var(--s1);border-radius:0 4px 4px 0;min-width:2px}
.bar.best .fill{background:var(--success)}
.bar .val{font-family:var(--mono);font-size:12.5px;text-align:right;min-width:88px}
.bar .val small{display:block;color:var(--on-surface-var);font-size:11px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--on-surface-var);margin-top:12px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.donutwrap{display:flex;gap:28px;flex-wrap:wrap;align-items:center}
.dlist{flex:1;min-width:240px}
.dlist .r{display:grid;grid-template-columns:12px 1fr auto 52px;gap:10px;align-items:center;padding:6px 0;font-size:13px;border-bottom:1px solid var(--outline-var)}
.dlist .r:last-child{border-bottom:0}
.dlist .dot{width:10px;height:10px;border-radius:3px}
.dlist .pct{color:var(--on-surface-var);font-size:12px;text-align:right}
.sp-axis,.sp-row{display:grid;grid-template-columns:minmax(110px,220px) 1fr;gap:12px;align-items:center}
.sp-axis{color:var(--on-surface-var);font-size:11px}
.sp-axis .ticks{position:relative;height:16px}
.sp-axis .ticks span{position:absolute;transform:translateX(-50%)}
.sp-row{height:30px;font-size:13px}
.sp-row .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sp-track{position:relative;height:100%;background-image:linear-gradient(to right,var(--outline-var) 1px,transparent 1px);background-size:25% 100%;border-right:1px solid var(--outline-var)}
.sp-track::before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:var(--outline-var)}
.dotm{position:absolute;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:var(--s1);box-shadow:0 0 0 2px var(--surface)}
.dotm.min{background:var(--success)}.dotm.max{background:var(--error)}
.dotm.clip{border-radius:3px 50% 50% 3px;width:14px;margin-left:-10px}
.dotm::after{content:"";position:absolute;inset:-6px;border-radius:50%}
.seg{display:inline-flex;border:1px solid var(--outline);border-radius:20px;overflow:hidden;height:40px}
.seg button{display:flex;align-items:center;gap:6px;padding:0 16px;font-weight:500;font-size:13.5px;border-right:1px solid var(--outline);color:var(--on-surface)}
.seg button:last-child{border-right:0}
.seg button:hover{background:var(--state-hover)}
.seg button.on{background:var(--secondary-container);color:var(--on-secondary-container)}
.lens-hero{border-radius:24px;background:var(--primary-container);color:var(--on-primary-container);padding:24px;text-align:center;margin:16px 0}
.lens-hero .big{font-size:44px;line-height:52px;font-weight:400;letter-spacing:-.01em;font-family:var(--font)}
.lens-hero .cap{font-size:13px;opacity:.85}
.fchips{display:flex;flex-wrap:wrap;gap:8px}
.fchip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 16px;border-radius:8px;border:1px solid var(--outline);font-weight:500;font-size:13px;color:var(--on-surface-var)}
.fchip:hover{background:var(--state-hover)}
.fchip.on{background:var(--secondary-container);border-color:transparent;color:var(--on-secondary-container);padding-left:8px}
.stepper{display:inline-flex;align-items:center;gap:6px}
.stepper b{min-width:32px;text-align:center;font-size:22px;font-weight:400}
.li{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--outline-var)}
.li:last-child{border-bottom:0}
.li .t{flex:1;min-width:0}
.li .t small{display:block;color:var(--on-surface-var);font-size:12px}
.li .n{font-family:var(--mono);text-align:right}
.li .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.src{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:12px;background:var(--sc-high);font-size:12px;color:var(--on-surface-var);max-width:45%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.src i{width:8px;height:8px;border-radius:50%;flex:none}
.good{color:var(--success)}.bad{color:var(--error)}

/* ---------- home ---------- */
.starter{background:var(--sc);padding:18px 0 26px}
.inner{max-width:1040px;margin:0 auto;padding:0 24px}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.hrow h2{font-size:16px;font-weight:500;margin:0}
.tpls{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px}
.tpl{display:flex;flex-direction:column;gap:8px;text-align:left}
.tpl .thumb{aspect-ratio:4/3;border-radius:8px;border:1px solid var(--outline-var);background:var(--surface);display:grid;place-items:center;overflow:hidden;transition:border-color .15s,box-shadow .15s}
.tpl:hover .thumb{border-color:var(--primary);box-shadow:var(--e1)}
.tpl .tn{font-weight:500;font-size:13.5px}
.tpl .ts{font-size:12px;color:var(--on-surface-var);margin-top:-6px}
.recent{padding:22px 0 60px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}
.dcard{border:1px solid var(--outline-var);border-radius:10px;overflow:hidden;background:var(--surface);transition:box-shadow .15s,border-color .15s}
.dcard:hover{border-color:transparent;box-shadow:var(--e2)}
.dcard .ct{display:block;width:100%;aspect-ratio:16/10;background:var(--sc-low);border-bottom:1px solid var(--outline-var);overflow:hidden}
.dcard .cm{display:flex;align-items:center;gap:10px;padding:10px 4px 10px 14px}
.dcard .ci{width:24px;height:24px;border-radius:6px;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;flex:none}
.dcard .ci .i{width:16px;height:16px}
.dcard .tx{flex:1;min-width:0}
.dcard .tx b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dcard .tx small{color:var(--on-surface-var);font-size:12px}
.empty{text-align:center;padding:56px 16px;color:var(--on-surface-var)}
.empty .i{width:64px;height:64px;margin:0 auto 12px;opacity:.5}
.empty h3{color:var(--on-surface);font-weight:500;font-size:20px;margin:0 0 6px}

/* ---------- sheet tabs (app bar) ---------- */
/* ---------- Chrome-style tab strip ---------- */
#tabstrip{display:flex;align-items:flex-end;gap:0;height:42px;padding:0 8px;background:var(--tabstrip);flex:none}
.ctabs{display:flex;align-items:flex-end;flex:1 1 auto;min-width:0;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;height:100%;padding:0 10px}
.ctab{position:relative;display:flex;align-items:center;gap:8px;height:34px;flex:0 1 220px;min-width:96px;padding:0 6px 0 12px;border-radius:10px 10px 0 0;color:var(--on-surface-var);font-size:13px;cursor:pointer;white-space:nowrap;user-select:none}
.ctab .lab{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.ctab:not(.on):hover{background:color-mix(in srgb,var(--bg) 55%,transparent)}
.ctab:not(.on)+.ctab:not(.on)::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:1px;background:var(--outline)}
.ctab:not(.on):hover::before,.ctab:not(.on):hover+.ctab::before{opacity:0}
.ctab.on{background:var(--bg);color:var(--on-surface);font-weight:500;z-index:2}
.ctab.on::before,.ctab.on::after{content:"";position:absolute;bottom:0;width:10px;height:10px;pointer-events:none}
.ctab.on::before{left:-10px;background:radial-gradient(circle at 0 0,transparent 9.5px,var(--bg) 10px)}
.ctab.on::after{right:-10px;background:radial-gradient(circle at 100% 0,transparent 9.5px,var(--bg) 10px)}
.ctab>.i{color:var(--primary)}
.ctab .cx{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;flex:none;color:var(--on-surface-var)}
.ctab .cx:hover{background:var(--state-press);color:var(--on-surface)}
.ctab.home{flex:none;min-width:0;width:44px;padding:0;justify-content:center;margin-right:-6px}
.ctab.home>.i{color:inherit}
.cnew{width:30px;height:30px;margin:0 0 2px 4px;border-radius:50%;display:grid;place-items:center;color:var(--on-surface-var);flex:none}
.cnew:hover{background:color-mix(in srgb,var(--bg) 55%,transparent)}
.bestchip{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 14px 0 10px;border-radius:16px;font-size:13px;background:var(--success-container);color:var(--success);font-weight:500;white-space:nowrap;flex:none;max-width:420px}
.bestchip .t{overflow:hidden;text-overflow:ellipsis}
.bestchip .mono{font-weight:600}
.bestchip.warnc{background:var(--warn-container);color:var(--warn)}

/* ---------- overlays ---------- */
#menu{position:fixed;z-index:120;min-width:220px;max-width:320px;max-height:70vh;overflow:auto;background:var(--sc);border-radius:4px;padding:8px 0;box-shadow:var(--e2);display:none}
#menu.on{display:block}
#menu button{display:flex;align-items:center;gap:12px;width:100%;height:36px;padding:0 16px 0 12px;text-align:left;color:var(--on-surface);font-size:14px}
#menu button:hover:not(:disabled){background:var(--state-hover)}
#menu button .i{color:var(--on-surface-var)}
#menu button .ph{width:20px;flex:none}
#menu button .k{margin-left:auto;padding-left:16px;color:var(--on-surface-var);font-size:12.5px}
#menu button.danger,#menu button.danger .i{color:var(--error)}
#menu hr{border:0;border-top:1px solid var(--outline-var);margin:8px 0}
#menu .mh{padding:6px 16px 4px;font-size:12px;color:var(--on-surface-var);font-weight:500}
#tip{position:fixed;z-index:200;pointer-events:none;background:var(--inverse-surface);color:var(--inverse-on-surface);font-size:12px;line-height:16px;padding:4px 8px;border-radius:4px;max-width:280px;display:none}
#snack{position:fixed;left:16px;bottom:16px;z-index:110;display:none;align-items:center;gap:4px;min-height:48px;padding:4px 4px 4px 16px;border-radius:4px;background:var(--inverse-surface);color:var(--inverse-on-surface);box-shadow:var(--e3);max-width:calc(100vw - 32px)}
#snack.on{display:flex}
#snack .btn.text{color:var(--inverse-primary)}
#snack .ibtn{color:var(--inverse-on-surface)}
#modal{position:fixed;inset:0;z-index:150;background:var(--scrim);display:none;align-items:center;justify-content:center;padding:24px}
#modal.on{display:flex}
.dlg{background:var(--sc-high);border-radius:28px;min-width:280px;max-width:560px;width:100%;padding:24px;box-shadow:var(--e3);max-height:90vh;overflow:auto}
.dlg h3{margin:0 0 16px;font-size:24px;line-height:32px;font-weight:400}
.dlg p{margin:0 0 20px;color:var(--on-surface-var);white-space:pre-wrap}
.dlg .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:20px}
.dlg .ml{display:flex;align-items:center;gap:16px;width:100%;padding:12px 16px;border-radius:12px;text-align:left}
.dlg .ml:hover{background:var(--state-hover)}
.dlg .ml .av{width:40px;height:40px;border-radius:50%;background:var(--primary-container);color:var(--on-primary-container);display:grid;place-items:center;flex:none}
.dlg .ml small{display:block;color:var(--on-surface-var);font-size:12.5px}
.dlg .row{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:12px 0;flex-wrap:wrap}
.dlg .row small{display:block;color:var(--on-surface-var);font-size:12.5px}
/* ---------- AI provenance + dialog ---------- */
td.ai{background-image:linear-gradient(135deg,#9b72f2 0 7px,transparent 7px)!important}
td.ai.nosrc{background-image:linear-gradient(135deg,#f29900 0 7px,transparent 7px)!important}
.dlg.wide{max-width:760px}
.dlg h3{display:flex;align-items:center;gap:10px}
.tarea,.tfield{width:100%;border:1px solid var(--outline);border-radius:8px;background:var(--surface);color:var(--on-surface);padding:10px 12px;font-family:var(--mono);font-size:12.5px;resize:vertical}
.tfield{font-family:var(--font);font-size:14px;height:44px;margin-bottom:8px}
.tarea:focus,.tfield:focus{outline:2px solid var(--primary);outline-offset:-1px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:pre-wrap}
/* ---------- trace (source cells) ---------- */
td.tr{box-shadow:inset 0 0 0 2px var(--hl-line)!important}
td.tr.sel{box-shadow:inset 0 0 0 2px var(--hl-line),inset 0 0 0 4px var(--sel)!important}
@keyframes trflash{0%{background:color-mix(in srgb,var(--hl-mark) 55%,transparent)}100%{background:transparent}}
td.tr.flash .cell,td.tr.flash .rv{animation:trflash 1.6s ease-out}
[data-act="trace"]{cursor:pointer}
.li[data-act="trace"]:hover,.bar[data-act="trace"]:hover{background:var(--state-hover);border-radius:8px}
.coltot[data-act="trace"]:hover{text-decoration:underline}
.trchip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 4px 0 10px;border-radius:15px;background:var(--hl-mark);color:#1f1f1f;font-size:12.5px;font-weight:500;max-width:46%;margin-left:8px}
.trchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trchip button{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#1f1f1f}
.trchip button:hover{background:rgba(0,0,0,.1)}
/* ---------- explain mode (layer 4) ---------- */
body.explain{--ex-act:#4c8df6;--ex-data:#f2b600}
body.explain :is([data-act],button,input[data-f],.ctab):not(:where(.sg *,#menu *,#exbar *,#explain *)){outline:2px solid var(--ex-act);outline-offset:1px}
body.explain :is(.coltot,[data-ex],#nameBox,#fres,.lbl,[data-trace]):not(:where(.sg td,.sg th)){outline:2px solid var(--ex-data);outline-offset:1px}
body.explain .gridwrap{outline:3px solid var(--ex-data);outline-offset:-3px}
body.explain .ex-hover{outline:3px solid var(--ex-act)!important;outline-offset:1px}
body.explain :is(td,th).ex-hover,body.explain .ex-hover:is(.coltot,[data-ex],#nameBox,#fres,.lbl,[data-trace],td[data-cell]){outline-color:var(--ex-data)!important}
body.explain .sg td.ex-hover,body.explain .sg th.ex-hover{outline-offset:-3px}
#explain{position:fixed;z-index:210;display:none;max-width:320px;background:var(--sc-high);color:var(--on-surface);border-radius:12px;padding:12px 16px 14px;box-shadow:var(--e2);pointer-events:none;font-size:13px}
#explain.on{display:block}
#explain .ek{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:1px 8px;margin-bottom:6px}
#explain .ek.act{background:#d3e3fd;color:#041e49}
#explain .ek.data{background:#fde293;color:#3a2a00}
#explain b{display:block;font-size:14px;font-weight:600;margin-bottom:2px}
#explain p{margin:0;color:var(--on-surface-var)}
#explain .es{margin-top:8px;padding-top:8px;border-top:1px solid var(--outline-var);font-family:var(--mono);font-size:12px;color:var(--on-surface)}
#explain .es span{display:block;font-family:var(--font);font-size:11px;color:var(--on-surface-var);margin-bottom:2px}
#explain .eh{display:flex;align-items:center;gap:6px;margin-top:8px;color:var(--primary);font-weight:500}
#exbar{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:115;display:none;align-items:center;gap:10px;padding:6px 6px 6px 16px;border-radius:24px;background:var(--inverse-surface);color:var(--inverse-on-surface);box-shadow:var(--e3);max-width:calc(100vw - 24px);font-size:13px}
#exbar.on{display:flex}
#exbar .btn.text{color:var(--inverse-primary)}
@media (max-width:760px){
  .ctab{flex-basis:150px;min-width:110px}
  :root{--gutW:36px;--nameW:136px;--baseW:108px;--cellW:108px}
  #appbar{padding:8px 8px 4px;gap:4px}
  .wordmark,.saved span{display:none}
  .search{flex:1 1 auto;min-width:0}
  .titleblock{flex:1 1 0}
  .doctitle{font-size:16px;max-width:100%;field-sizing:fixed;flex:1 1 0}
  .titlerow{flex-wrap:wrap;row-gap:2px}
  .bestslot{padding-left:8px}
  #rail{position:absolute;right:0;top:0;bottom:0;z-index:60;box-shadow:var(--e3);border-radius:16px 0 0 16px}

/* ---------- parse: number | rate (price/qty) | expression ---------- */
const NUM_RE=/^[+-]?(\d+(\.\d*)?|\.\d+)([eE][+-]?\d+)?$/;
/* Recursive-descent evaluator: + - * / ( ) and unary +/-. No eval()/Function(). */
function evalMath(src){
  let i=0; const s=src, n=s.length;
  const ws=()=>{ while(i<n&&/\s/.test(s[i])) i++; };
  function primary(){
    ws();
    if(s[i]==='('){ i++; const v=expr(); ws(); if(s[i]!==')') throw 0; i++; return v; }
    const m=/^(\d+\.?\d*|\.\d+)/.exec(s.slice(i)); if(!m) throw 0; i+=m[0].length; return parseFloat(m[0]);
  }
  function unary(){ ws(); if(s[i]==='-'){i++;return -unary();} if(s[i]==='+'){i++;return unary();} return primary(); }
  function term(){ let v=unary(); for(;;){ ws(); if(s[i]==='*'){i++;v*=unary();} else if(s[i]==='/'){i++;v/=unary();} else return v; } }
  function expr(){ let v=term(); for(;;){ ws(); if(s[i]==='+'){i++;v+=term();} else if(s[i]==='-'){i++;v-=term();} else return v; } }
  try{ const v=expr(); ws(); if(i!==n) return null; return v; }catch(e){ return null; }
}
function parse(raw){
  const s=raw==null?'':String(raw).trim();
  if(!s) return {value:0,mode:'empty'};
  if(s.includes('/')){
    const parts=s.split('/').filter(x=>x.length>0);
    if(parts.length===2&&NUM_RE.test(parts[0])&&NUM_RE.test(parts[1])){
      const price=+parts[0], volume=+parts[1];
      if(volume!==0&&isFinite(price/volume)) return {value:price/volume,mode:'rate',price,volume};
    }
  }
  if(NUM_RE.test(s)){ const v=+s; if(isFinite(v)) return {value:v,mode:'number'}; }
  if(/^[\d\s+\-*/().]+$/.test(s)){ const v=evalMath(s); if(v!==null&&isFinite(v)) return {value:v,mode:'expr'}; }
  return {value:0,mode:'error'};
}
/* A cell "counts" when the user actually entered a readable value. An explicit 0 (free shipping)
   counts; a blank cell (store doesn't sell it) and an unreadable cell do not. */
const isValid=p=>p.mode!=='empty'&&p.mode!=='error';

/* ---------- calculation engine (port of CalculationEngine.calculateSheet) ---------- */
function calculateSheet(sheet,hl){
  const vars=sheet.variables, grand={}, section={}, P={};
  vars.forEach(v=>grand[v.id]=0);
  let cur=null;
  for(const r of sheet.rows){
    if(r.type==='group'){ cur=r.id; section[cur]={}; vars.forEach(v=>section[cur][v.id]=0); }
    else{
      P[r.id]={};
      for(const v of vars){ const p=parse(r.rawData[v.id]); P[r.id][v.id]=p; grand[v.id]+=p.value; if(cur) section[cur][v.id]+=p.value; }
    }
  }
  let baseId=sheet.baseVarId;
  if(!baseId||!vars.some(v=>v.id===baseId)) baseId=vars[0]?vars[0].id:null;
  const baseTotal=baseId?grand[baseId]:0;

  const diffs={};
  for(const v of vars){
    const tot=grand[v.id]||0;
    if(tot===0) diffs[v.id]={abs:null,pct:null,isBase:false};
    else if(v.id===baseId) diffs[v.id]={abs:null,pct:null,isBase:true};
    else { const a=tot-baseTotal; diffs[v.id]={abs:a,pct:baseTotal>0?a/baseTotal*100:0,isBase:false}; }
  }

  /* coverage: which columns price every item that at least one column prices */
  const items=sheet.rows.filter(r=>r.type==='item');
  const coverable=items.filter(r=>vars.some(v=>isValid(P[r.id][v.id])));
  const cols={};
  for(const v of vars){
    const covered=coverable.filter(r=>isValid(P[r.id][v.id])).length;
    cols[v.id]={covered,of:coverable.length,complete:coverable.length>0&&covered===coverable.length,hasData:covered>0};
  }

  const rowResults=[];
  for(const r of sheet.rows){
    if(r.type==='group'){
      const sub=section[r.id]||{}, gb=baseId?(sub[baseId]||0):0, gd={};
      for(const v of vars){
        const val=sub[v.id]||0;
        if(val===0) gd[v.id]={abs:null,pct:null,isBase:false};
        else if(v.id===baseId) gd[v.id]={abs:null,pct:null,isBase:true};
        else if(gb>0){ const a=val-gb; gd[v.id]={abs:a,pct:a/gb*100,isBase:false}; }
        else gd[v.id]={abs:null,pct:null,isBase:false};
      }
      const pos=Object.values(sub).filter(x=>x>0);
      rowResults.push({id:r.id,name:r.name,type:'group',groupSubtotals:sub,groupDiffs:gd,averageValue:pos.length?pos.reduce((a,b)=>a+b,0)/pos.length:0});
    }else{
      const pm=P[r.id], pos=vars.map(v=>pm[v.id].value).filter(x=>x>0);
      const bv=baseId?pm[baseId].value:0, cells=[];
      for(const v of vars){
        const p=pm[v.id], isBase=v.id===baseId; let da=null,dp=null;
        if(!isBase&&p.value>0&&bv>0){ da=p.value-bv; dp=da/bv*100; }
        cells.push({varId:v.id,raw:r.rawData[v.id]||'',parsed:p,isBase,diffAbsolute:da,diffPercentage:dp});
      }
      rowResults.push({id:r.id,name:r.name,type:'item',cellResults:cells,averageValue:pos.length?pos.reduce((a,b)=>a+b,0)/pos.length:0});
    }
  }

  /* best value: extreme grand total among columns that price every item (falls back to all columns) */
  const cand=vars.filter(v=>cols[v.id].hasData&&grand[v.id]>0);
  const full=cand.filter(v=>cols[v.id].complete);
  const pool=full.length?full:cand;
  let best=null;
  for(const v of pool){ if(best===null||(hl==='max'?grand[v.id]>grand[best]:grand[v.id]<grand[best])) best=v.id; }
  return {subtotals:grand,diffs,bestValueVarId:best,bestIsIncomplete:!!best&&full.length===0,baseVarId:baseId,sectionTotals:section,rowResults,cols,parsed:P};
}

/* ---------- Lens engine (port of LensEngine.swift) ---------- */
function lensGrid(sheet){
  const vars=sheet.variables, items=sheet.rows.filter(r=>r.type==='item');
  const grid=items.map(r=>vars.map(v=>{ const p=parse(r.rawData[v.id]); return isValid(p)?p.value:null; }));
  return {vars,items,grid};
}
function better(dir,a,b){ return dir==='max'?a>b:a<b; }
function pickBest(rowVals,cols,dir){ /* rowVals: array over all vars; cols: column indexes allowed */
  let bi=-1;
  for(const c of cols){ const x=rowVals[c]; if(x===null) continue; if(bi<0||better(dir,x,rowVals[bi])) bi=c; }
  return bi;
}
function lensBenchmark(sheet){
  const {vars,items,grid}=lensGrid(sheet);
  if(!vars.length||!items.length) return {cheapest:null,priciest:null,incomplete:false};
  const coverable=new Set(); grid.forEach((row,ri)=>{ if(row.some(x=>x!==null)) coverable.add(ri); });
  const cols=[];
  vars.forEach((v,ci)=>{
    let total=0,cov=0;
    grid.forEach((row,ri)=>{ if(row[ci]===null) return; total+=row[ci]; if(coverable.has(ri)) cov++; });
    if(cov>0) cols.push({varId:v.id,varName:v.name,total,isComplete:cov===coverable.size});
  });
  if(!cols.length) return {cheapest:null,priciest:null,incomplete:false};
  const full=cols.filter(c=>c.isComplete), pool=full.length?full:cols;
  let mn=pool[0],mx=pool[0]; pool.forEach(c=>{ if(c.total<mn.total)mn=c; if(c.total>mx.total)mx=c; });
  return {cheapest:mn,priciest:mx,incomplete:!full.length};
}
function lensBuild(sheet,chosenIdx,dir,approx){
  const {vars,items,grid}=lensGrid(sheet);
  const picks=[]; let total=0;
  items.forEach((r,ri)=>{
    const bi=pickBest(grid[ri],chosenIdx,dir);
    if(bi>=0){ total+=grid[ri][bi]; picks.push({id:r.id,rowName:r.name,value:grid[ri][bi],sourceVarId:vars[bi].id,sourceVarName:vars[bi].name}); }
    else picks.push({id:r.id,rowName:r.name,value:0,sourceVarId:null,sourceVarName:''});
  });
  return {picks,totalCost:total,isApproximate:!!approx};
}
function lensGlobal(sheet,mode){
  const dir=mode==='max'?'max':'min', {vars}=lensGrid(sheet);
  const r=lensBuild(sheet,vars.map((_,i)=>i),dir,false);
  const used=[]; r.picks.forEach(p=>{ if(p.sourceVarId&&!used.includes(p.sourceVarId)) used.push(p.sourceVarId); });
  r.usedVarIds=used; r.totalVarCount=vars.length; return r;
}
function lensScoped(sheet,selected,mode){
  const dir=mode==='max'?'max':'min', {vars}=lensGrid(sheet);
  if(!selected.size) return {picks:[],totalCost:0,usedVarIds:[],totalVarCount:vars.length,isApproximate:false};
  const idx=vars.map((v,i)=>selected.has(v.id)?i:-1).filter(i=>i>=0);
  const r=lensBuild(sheet,idx,dir,false);
  const used=[]; r.picks.forEach(p=>{ if(p.sourceVarId&&!used.includes(p.sourceVarId)) used.push(p.sourceVarId); });
  r.usedVarIds=used; r.totalVarCount=vars.length; return r;
}
function nChooseK(n,k){ if(k<0||k>n) return 0; const kk=Math.min(k,n-k); let r=1; for(let i=0;i<kk;i++) r=r*(n-i)/(i+1); return Math.round(r); }
function lensConstraint(sheet,n,mode){
  const dir=mode==='max'?'max':'min', {vars,items,grid}=lensGrid(sheet);
  const empty={picks:[],totalCost:0,usedVarIds:[],totalVarCount:vars.length,isApproximate:false};
  if(!vars.length||!items.length) return empty;
  const k=Math.max(1,Math.min(n,vars.length)), V=vars.length;
  const combos=V<=30?nChooseK(V,k):Infinity, LIMIT=200000;
  let chosen, approx=false;
  if(combos>0&&combos<=LIMIT){
    /* exhaustive search: rank by rows covered first, then by cost */
    let bestCombo=null,bestTotal=0,bestCov=-1; const cur=[];
    const evalCombo=()=>{
      let tot=0,cov=0;
      for(const row of grid){ const bi=pickBest(row,cur,dir); if(bi>=0){ tot+=row[bi]; cov++; } }
      if(bestCombo===null||cov>bestCov){ bestCombo=cur.slice(); bestTotal=tot; bestCov=cov; }
      else if(cov===bestCov&&better(dir,tot,bestTotal)){ bestCombo=cur.slice(); bestTotal=tot; }
    };
    (function rec(start){
      if(cur.length===k){ evalCombo(); return; }
      if(V-start<k-cur.length) return;
      cur.push(start); rec(start+1); cur.pop(); rec(start+1);
    })(0);
    chosen=bestCombo||[...Array(k).keys()];
  }else{
    approx=true;
    const score=new Array(V).fill(0), winSum=new Array(V).fill(0);
    for(const row of grid){ const bi=pickBest(row,[...Array(V).keys()],dir); if(bi<0) continue; const wv=row[bi]; row.forEach((x,c)=>{ if(x!==null&&x===wv){ score[c]++; winSum[c]+=x; } }); }
    chosen=[...Array(V).keys()].sort((a,b)=>score[a]!==score[b]?score[b]-score[a]:(dir==='max'?winSum[b]-winSum[a]:(winSum[a]||Infinity)-(winSum[b]||Infinity))).slice(0,k);
  }
  const r=lensBuild(sheet,chosen,dir,approx);
  r.usedVarIds=chosen.map(i=>vars[i].id); r.totalVarCount=V; return r;
}
function lensDiff(total,ref){ const a=total-ref; return {abs:a,pct:ref!==0?a/ref*100:null}; }

/* ---------- history (undo/redo, 50 snapshots of the current sheet) ---------- */
const canUndo=()=>S.hIndex>0, canRedo=()=>S.hIndex>=0&&S.hIndex<S.history.length-1;
function resetHistory(){ S.history=[]; S.hIndex=-1; }
function pushHistory(){
  const sh=cur(); if(!sh) return; const snap=JSON.stringify(sh);
  if(S.hIndex>=0&&S.history[S.hIndex]===snap) return;
  if(S.hIndex>=0) S.history=S.history.slice(0,S.hIndex+1);
  S.history.push(snap); if(S.history.length>50) S.history.shift();
  S.hIndex=S.history.length-1;
}
function restoreSnap(json){
  const sh=JSON.parse(json), i=S.sheets.findIndex(s=>s.id===sh.id);
  if(i>=0) S.sheets[i]=sh; updateVisibility(sh); save(); recompute();
}
function undo(){ if(canUndo()){ S.hIndex--; restoreSnap(S.history[S.hIndex]); renderAll(); } }
function redo(){ if(canRedo()){ S.hIndex++; restoreSnap(S.history[S.hIndex]); renderAll(); } }

/* ---------- mutations (each = one undo step) ---------- */
function commit(){ const sh=cur(); if(sh) updateVisibility(sh); save(); recompute(); pushHistory(); }
function setRaw(rowId,varId,val){ const sh=cur(); const r=sh&&sh.rows.find(x=>x.id===rowId); if(r){ r.rawData[varId]=val; if(sh.meta) delete sh.meta[rowId+'|'+varId]; save(); recompute(); } }   /* a hand edit replaces the AI value, so its provenance goes */
function addRow(type){ const sh=cur(); if(!sh) return null; const r=mkRow(type,type==='group'?'New Group':'New Item'); sh.rows.push(r); commit(); return r; }
function addVariable(){ const sh=cur(); if(!sh) return null; const v=mkVar('New Column'); sh.variables.push(v); commit(); return v; }
function deleteRow(id){ const sh=cur(); if(!sh||sh.rows.length<=1) return; sh.rows=sh.rows.filter(r=>r.id!==id); S.active=null; commit(); }
function duplicateRow(id){ const sh=cur(); const i=sh.rows.findIndex(r=>r.id===id); if(i<0) return; const c=JSON.parse(JSON.stringify(sh.rows[i])); c.id=uid(); c.name+=' (Copy)'; sh.rows.splice(i+1,0,c); commit(); }
function toggleGroup(id){ const sh=cur(); const r=sh.rows.find(x=>x.id===id); if(r&&r.type==='group'){ r.isCollapsed=!r.isCollapsed; commit(); } }
function deleteVariable(id){
  const sh=cur(); if(!sh||sh.variables.length<=1) return;
  sh.variables=sh.variables.filter(v=>v.id!==id); sh.rows.forEach(r=>delete r.rawData[id]); if(sh.meta) for(const k in sh.meta) if(k.endsWith('|'+id)) delete sh.meta[k];
  if(sh.baseVarId===id) sh.baseVarId=null; S.lensScoped.delete(id); S.active=null; commit();
}
function duplicateVariable(id){
  const sh=cur(); const i=sh.variables.findIndex(v=>v.id===id); if(i<0) return;
  const nv=Object.assign({},sh.variables[i],{id:uid(),name:sh.variables[i].name+' (Copy)'}); sh.variables.splice(i+1,0,nv);
  sh.rows.forEach(r=>{ if(r.rawData[id]!==undefined) r.rawData[nv.id]=r.rawData[id]; }); commit();
}
function setBase(id){ const sh=cur(); sh.baseVarId=id; commit(); }
function blockRange(rows,idx){ /* [start,end) of the group block containing idx (or the single leading item) */
  if(rows[idx].type==='group'){ let e=idx+1; while(e<rows.length&&rows[e].type==='item') e++; return [idx,e]; }
  let s=idx; while(s>=0&&rows[s].type!=='group') s--; if(s<0) return [idx,idx+1];
  let e=s+1; while(e<rows.length&&rows[e].type==='item') e++; return [s,e];
}
function moveRow(fromId,toId){
  const sh=cur(); const rows=sh.rows; const from=rows.findIndex(r=>r.id===fromId), to=rows.findIndex(r=>r.id===toId);
  if(from<0||to<0||from===to) return;
  let chunkS=from, chunkE=from+1;
  if(rows[from].type==='group'){ [chunkS,chunkE]=blockRange(rows,from); if(to>=chunkS&&to<chunkE) return; }
  const chunk=rows.slice(chunkS,chunkE); let ins;
  if(rows[from].type==='group'){ const [ts,te]=blockRange(rows,to); ins=to<from?ts:te; }
  else ins=to<from?to:to+1;
  const rest=rows.filter((_,i)=>i<chunkS||i>=chunkE);
  const removedBefore=chunk.length*(ins>chunkS?1:0); ins-=removedBefore;
  rest.splice(ins,0,...chunk); sh.rows=rest; commit();
}
function moveVariable(fromId,toId){
  const sh=cur(); const vs=sh.variables; const from=vs.findIndex(v=>v.id===fromId), to=vs.findIndex(v=>v.id===toId);
  if(from<0||to<0||from===to) return; const [it]=vs.splice(from,1); vs.splice(to,0,it); commit();
}

  if(c.meta){ const nm={}; for(const k in c.meta){ const [ro,vo]=k.split('|'); if(rmap[ro]&&map[vo]) nm[rmap[ro]+'|'+map[vo]]=c.meta[k]; } c.meta=nm; }

/* ---------- CSV ---------- */
const csvField=s=>'"'+String(s==null?'':s).replace(/"/g,'""')+'"';
function generateCSV(sh){
  const lines=[[csvField('Row Name'),...sh.variables.map(v=>csvField(v.name))].join(',')];
  for(const r of sh.rows){
    const f=[csvField(r.name)]; for(const v of sh.variables) f.push(csvField(r.rawData[v.id]||''));
    if(r.type==='group') f.push(csvField('#GROUP')); lines.push(f.join(','));
  }
  return '﻿'+lines.join('\r\n')+'\r\n';
}
function parseCSV(text){
  const rows=[]; let row=[],f='',q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if(c==='"'&&f==='') q=true;
    else if(c===','){ row.push(f); f=''; }
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n') i++; row.push(f); rows.push(row); row=[]; f=''; }
    else f+=c;
  }
  if(f!==''||row.length){ row.push(f); rows.push(row); }
  return rows.filter(r=>!(r.length===1&&r[0].trim()===''));
}
function importCSV(text,fileName){
  text=text.replace(/^﻿/,''); const rows=parseCSV(text), warns=[];
  if(!rows.length) return {error:t('Import Error Empty File')};
  const head=rows[0].map(x=>x.trim());
  if(head.length<2) return {error:t('Import Error No Columns')};
  const vars=[], used=new Set();
  for(let i=1;i<head.length;i++){
    let name=head[i]; if(name==='#GROUP') continue;
    if(!name){ name=t('Column')+' '+(vars.length+1); warns.push(t('Import Warning Empty Header')); }
    if(used.has(name)){ let n=2,c=name+' ('+n+')'; while(used.has(c)){ n++; c=name+' ('+n+')'; } warns.push(t('Import Warning Duplicate Header',name)); name=c; }
    used.add(name); vars.push(mkVar(name));
  }
  if(!vars.length) return {error:t('Import Error No Columns')};
  const out=[]; let incomplete=0;
  for(let i=1;i<rows.length;i++){
    const parts=rows[i].map(x=>x.trim()); const isGroup=parts[parts.length-1]==='#GROUP';
    const dataCount=isGroup?parts.length-1:parts.length, expected=vars.length+1;
    if(dataCount>expected) return {error:t('Import Error Extra Columns',i+1,dataCount,expected)};
    if(dataCount<expected) incomplete++;
    const r=mkRow(isGroup?'group':'item',parts[0]);
    if(!isGroup) for(let j=1;j<Math.min(parts.length,vars.length+1);j++) r.rawData[vars[j-1].id]=parts[j];
    out.push(r);
  }
  if(incomplete) warns.push(t('Import Warning Missing Cells',incomplete));
  const sh=mkSheet((fileName||'').replace(/\.csv$/i,'')||t('Imported')); sh.variables=vars; sh.rows=out; updateVisibility(sh);
  S.sheets.push(sh); S.currentSheetId=sh.id; S.screen='sheet'; S.view='data'; S.active=null; resetHistory(); recompute(); pushHistory(); save();
  return {warn:warns.length?warns.join('\n'):null};
}
function download(name,text,type){
  const b=new Blob([text],{type:type||'text/csv;charset=utf-8'}); const a=document.createElement('a');
  a.href=URL.createObjectURL(b); a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

/* Sort (spec 4.2): pure function → new order; the sheet itself is never mutated.
   axis: allRows | allColumns (aggregate) · byColumn (rows reordered by one column) · byRow (columns reordered by one row) */
function sortOrder(sh,c,sc){
  const vars=sh.variables.slice(), rowIds=sh.rows.map(r=>r.id);
  if(!sc||!c) return {vars,rows:rowIds};
  if(sc.axis==='byColumn'&&!sh.variables.some(v=>v.id===sc.varId)) return {vars,rows:rowIds};
  if(sc.axis==='byRow'&&!(c.parsed[sc.rowId])) return {vars,rows:rowIds};
  const dir=sc.ascending?1:-1, cmp=(a,b)=>a==null&&b==null?0:a==null?1:b==null?-1:(a-b)*dir;   /* blanks always last */
  if(sc.axis==='allColumns'||sc.axis==='byRow'){
    const key=v=>{ if(sc.axis==='allColumns') return c.subtotals[v.id]>0?c.subtotals[v.id]:null; const p=c.parsed[sc.rowId][v.id]; return isValid(p)?p.value:null; };
    vars.sort((a,b)=>cmp(key(a),key(b))); return {vars,rows:rowIds};
  }
  const key=rr=>{ if(sc.axis==='allRows') return rr.averageValue>0?rr.averageValue:null;
    if(rr.type==='group'){ const x=rr.groupSubtotals[sc.varId]; return x>0?x:null; }
    const p=rr.cellResults.find(x=>x.varId===sc.varId).parsed; return isValid(p)?p.value:null; };
  const lead=[],blocks=[]; for(const rr of c.rowResults){ if(rr.type==='group') blocks.push({g:rr,items:[]}); else if(!blocks.length) lead.push(rr); else blocks[blocks.length-1].items.push(rr); }
  const f=(a,b)=>cmp(key(a),key(b)); lead.sort(f); blocks.forEach(b=>b.items.sort(f)); blocks.sort((a,b)=>f(a.g,b.g));   /* groups move as whole blocks */
  const rows=lead.map(r=>r.id); blocks.forEach(b=>rows.push(b.g.id,...b.items.map(r=>r.id)));
  return {vars,rows};
}
function sortLabel(){
  const sc=S.sortConfig, sh=cur(); if(!sc) return t('Filter');
  const arrow=sc.ascending?t('Min to Max'):t('Max to Min');
  if(sc.axis==='allRows') return t('Items')+': '+arrow;
  if(sc.axis==='allColumns') return t('Stores')+': '+arrow;
  if(sc.axis==='byColumn'){ const v=sh&&sh.variables.find(x=>x.id===sc.varId); return t('lbl rows by',v?v.name:'?')+' '+(sc.ascending?'↑':'↓'); }
  const r=sh&&sh.rows.find(x=>x.id===sc.rowId); return t('lbl cols by',r?r.name:'?')+' '+(sc.ascending?'↑':'↓');
}

/* ---------- mini thumbnail of a sheet (real data) ---------- */
function thumb(sh){
  const c=calculateSheet(sh,'none'), vars=sh.variables.slice(0,5), rows=sh.rows.slice(0,7);
  const W=240,H=150,x0=10,nameW=70,cw=(W-x0*2-nameW)/Math.max(vars.length,1),rh=16,y0=10;
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" height="100%" preserveAspectRatio="xMidYMin slice" aria-hidden="true"><rect width="${W}" height="${H}" fill="var(--surface)"/>`;
  s+=`<rect x="${x0}" y="${y0}" width="${W-2*x0}" height="${rh}" fill="var(--grid-head)"/>`;
  vars.forEach((v,i)=>{ if(v.id===c.bestValueVarId) s+=`<rect x="${x0+nameW+i*cw}" y="${y0}" width="${cw}" height="${rh*(rows.length+1)}" fill="var(--success-container)"/>`; });
  rows.forEach((r,j)=>{ const y=y0+rh*(j+1); if(r.type==='group') s+=`<rect x="${x0}" y="${y}" width="${W-2*x0}" height="${rh}" fill="var(--sc)"/>`;
    s+=`<rect x="${x0+5}" y="${y+6}" width="${Math.min(nameW-12,8+((r.name||'').length*2.2))}" height="4" rx="2" fill="var(--outline-var)"/>`;
    if(r.type==='item') vars.forEach((v,i)=>{ const p=parse(r.rawData[v.id]); if(isValid(p)) s+=`<rect x="${x0+nameW+(i+1)*cw-6-Math.min(cw-12,14)}" y="${y+6}" width="${Math.min(cw-12,14)}" height="4" rx="2" fill="var(--outline)" opacity=".55"/>`; }); });
  for(let j=0;j<=rows.length+1;j++) s+=`<line x1="${x0}" x2="${W-x0}" y1="${y0+j*rh}" y2="${y0+j*rh}" stroke="var(--grid)"/>`;
  s+=`<line x1="${x0+nameW}" x2="${x0+nameW}" y1="${y0}" y2="${y0+rh*(rows.length+1)}" stroke="var(--grid)"/>`;
  vars.forEach((v,i)=>{ s+=`<line x1="${x0+nameW+(i+1)*cw}" x2="${x0+nameW+(i+1)*cw}" y1="${y0}" y2="${y0+rh*(rows.length+1)}" stroke="var(--grid)"/>`; });
  return s+'</svg>';
}

/* live updates while typing — never rebuilds inputs, so focus/caret survive */
function refreshDerived(){
  const sh=cur(), c=S.computed; if(!sh||!c||S.screen!=='sheet'||S.view!=='data') { renderSheetbar(); return; }
  const q=S.searchQuery.trim().toLowerCase();
  sh.variables.forEach(v=>{
    const tot=document.querySelector(`[data-tot="${v.id}"]`), sub=document.querySelector(`[data-sub="${v.id}"]`);
    if(tot) tot.textContent=c.subtotals[v.id]>0?fmt(c.subtotals[v.id]):'—';
    if(sub){
      const col=c.cols[v.id]; let b='';
      if(v.id===c.baseVarId) b+=`<span class="lbl base">${ic('star_fill')}${esc(t('BASELINE'))}</span>`;
      
      if(col.hasData&&!col.complete) b+=`<span class="lbl warn" data-tip="${esc(t('Incomplete'))}: ${esc(t('items priced',col.covered,col.of))}">${ic('warning')}${esc(t('items priced short',col.covered,col.of))}</span>`;
      sub.innerHTML=b;
    }
    const th=document.querySelector(`th[data-var="${v.id}"]`); if(th) th.classList.toggle('match',matchQ(v.name));
  });
  const P=c.parsed;
  sh.rows.forEach(r=>{
    const lab=document.querySelector(`[data-rowlabel="${r.id}"]`); if(lab) lab.classList.toggle('match',matchQ(r.name));
    if(r.type!=='item') return;
    const target=hlTarget(sh.variables.map(v=>P[r.id][v.id]).filter(isValid).map(p=>p.value));
    sh.variables.forEach(v=>{
      const td=document.querySelector(`[data-cell="${r.id}|${v.id}"]`); if(!td) return;
      const p=P[r.id][v.id];
      const on=target!==null&&isValid(p)&&Math.abs(p.value-target)<1e-9; td.classList.toggle('hl',on);
      if(on){ const inp=td.querySelector('input'); if(inp) td.style.setProperty('--hlw',textW(inp)+'px'); }
      td.classList.toggle('err',p.mode==='error'); td.classList.toggle('tr',!!(S.trace&&S.trace.cells.has(r.id+'|'+v.id)));
      const am=sh.meta&&sh.meta[r.id+'|'+v.id]; td.classList.toggle('ai',!!am); td.classList.toggle('nosrc',!!(am&&!am.src));
      if(am) td.dataset.tip=am.src?t('AI src',am.src,am.at||'?'):t('AI nosrc'); else delete td.dataset.tip;
      td.classList.toggle('match',matchQ(r.rawData[v.id],isValid(p)?fmt(p.value):''));
    });
  });
  syncSelection(); renderSheetbar();
}
const _cv=document.createElement('canvas').getContext('2d');
function textW(inp){ const cs=getComputedStyle(inp); _cv.font=`${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`; return Math.ceil(_cv.measureText(inp.value.trim()).width); }
function syncSelection(){
  document.querySelectorAll('.sel,.colstrip.hi,.g-num.hi').forEach(n=>n.classList.remove('sel','hi'));
  const a=S.active; if(!a) return;
  if(a.r&&a.v){ const td=document.querySelector(`[data-cell="${a.r}|${a.v}"]`); if(td) td.classList.add('sel'); }
  if(a.r){ const n=document.querySelector(`[data-num="${a.r}"]`); if(n) n.classList.add('hi'); }
  if(a.v){ const s=document.querySelector(`[data-strip="${a.v}"]`); if(s) s.classList.add('hi'); }
}

/* ---------- BUDGET (compare lens results + single stores against a budget X) ---------- */
function budgetValue(sh){ const p=parse(sh.budget); return isValid(p)&&p.value>0?p.value:null; }
function budgetOptions(sh){

  out.push({group:'lens',label:`L2 · ${t('Lens Constraint')} (n=${Math.min(S.lensN,sh.variables.length)})`,sub:`${t('Stores Used')}: ${usedN(k)}/${sh.variables.length}`,total:k.totalCost,ok:true,spec:'lens:1'});
  if(S.lensScoped.size){ const s=lensScoped(sh,S.lensScoped,mode); out.push({group:'lens',label:'L3 · '+t('Lens Scoped'),sub:sh.variables.filter(v=>S.lensScoped.has(v.id)).map(v=>v.name).join(', '),total:s.totalCost,ok:true,spec:'lens:2'}); }

/* ---------- cell sets ---------- */
const ck=(r,v)=>r+'|'+v;
function colCells(sh,vid){ return sh.rows.filter(r=>r.type==='item'&&isValid(parse(r.rawData[vid]))).map(r=>ck(r.id,vid)); }
function groupCells(sh,gid,vid){ const i=sh.rows.findIndex(r=>r.id===gid); if(i<0) return []; const [s,e]=blockRange(sh.rows,i); return sh.rows.slice(s+1,e).filter(r=>isValid(parse(r.rawData[vid]))).map(r=>ck(r.id,vid)); }
function lensFor(sh,m){ return m===1?lensConstraint(sh,S.lensN,S.highlightMode):m===2?lensScoped(sh,S.lensScoped,S.highlightMode):lensGlobal(sh,S.highlightMode); }
const pickCells=(res,vid)=>res.picks.filter(p=>p.sourceVarId&&(!vid||p.sourceVarId===vid)).map(p=>ck(p.id,p.sourceVarId));
/* trace specs are resolved at click time, so they always match the current data */
function resolveTrace(spec){
  const sh=cur(); if(!sh) return null; const [k,a,b]=spec.split(':');
  if(k==='cell') return new Set([ck(a,b)]);
  if(k==='col') return new Set(colCells(sh,a));
  if(k==='best') return S.computed&&S.computed.bestValueVarId?new Set(colCells(sh,S.computed.bestValueVarId)):null;
  if(k==='group') return new Set(groupCells(sh,a,b));
  if(k==='lens') return new Set(pickCells(lensFor(sh,+a)));
  if(k==='lensStore') return new Set(pickCells(lensFor(sh,+a),b));
  if(k==='cells') return new Set(a.split(',').map(x=>x.replace('~','|')));
  return null;
}
const trA=(spec,label,title,body,src)=>`data-act="trace" data-trace="${esc(spec)}" data-tl="${esc(label)}" data-ex="${esc(title||label)}" data-exb="${esc(body||'')}" data-exs="${esc(src||'')}"`;
function doTrace(spec,label){
  const cells=resolveTrace(spec), sh=cur(); if(!cells||!cells.size||!sh) return;
  let changed=false;   /* open collapsed groups that hide a traced row */
  sh.rows.forEach((row,i)=>{ if(row.type==='group'&&row.isCollapsed){ const [s,e]=blockRange(sh.rows,i); for(let j=s+1;j<e;j++){ const id=sh.rows[j].id; if([...cells].some(c=>c.startsWith(id+'|'))){ row.isCollapsed=false; changed=true; break; } } } });
  if(changed){ updateVisibility(sh); save(); }
  if(S.baselineCollapsed&&S.computed&&[...cells].some(c=>c.endsWith('|'+S.computed.baseVarId))) S.baselineCollapsed=false;
  S.trace={cells,label}; S.view='data'; S.screen='sheet'; if(innerWidth<=760) S.railOpen=false;
  renderAll();
  requestAnimationFrame(()=>{ const tds=[...document.querySelectorAll('td.tr')]; if(tds[0]) tds[0].scrollIntoView({block:'center',inline:'center'});
    tds.forEach(td=>{ td.classList.remove('flash'); void td.offsetWidth; td.classList.add('flash'); }); });
}
function clearTrace(){ if(!S.trace) return; S.trace=null; if(S.view==='data') refreshDerived(); else renderMain(); renderVTabs(); }
function cellRef(sh,rid,vid){ const dv=displayVars(sh), ci=dv.findIndex(v=>v.id===vid), ri=sh.rows.findIndex(r=>r.id===rid); return ci<0||ri<0?'':colLetter(ci)+(ri+1); }

function exData(el){
  const sh=cur(), c=S.computed;
  const tdc=el.closest('td[data-cell]');
  if(tdc&&sh){ const [rid,vid]=tdc.dataset.cell.split('|'), r=sh.rows.find(x=>x.id===rid), v=sh.variables.find(x=>x.id===vid), p=parse(r.rawData[vid]);
    const how=p.mode==='rate'?`${fmt(p.price)} ÷ ${fmt(p.volume)} = ${fmt(p.value)} ${X('(ราคาต่อหน่วย)','(unit price)')}`:p.mode==='expr'?`${r.rawData[vid]} = ${fmt(p.value)}`:p.mode==='empty'?X('ว่าง = ตัวเลือกนี้ไม่มีสินค้านี้ ไม่นับในการเทียบ','Empty = this store does not sell it; not compared.'):p.mode==='error'?X('อ่านค่าไม่ได้ ไม่ถูกนับ','Unreadable; not counted.'):fmt(p.value);
    const am=sh.meta&&sh.meta[rid+'|'+vid];
    return [`${cellRef(sh,rid,vid)} · ${v.name} · ${r.name}`,am?(am.src?t('AI src',am.src,am.at||'?'):t('AI nosrc')):X('ข้อมูลต้นทาง (Layer 1) ที่กรอกเอง แก้ได้','Source data you typed (Layer 1); editable.'),how]; }
  const tot=el.closest('.coltot');
  if(tot&&sh){ const vid=tot.dataset.tot, v=sh.variables.find(x=>x.id===vid), col=c.cols[vid];
    return [X('ยอดรวม ','Total ')+v.name,X('ผลรวมราคาทุกรายการในคอลัมน์นี้','Sum of every price in this column.'),X(`บวกจาก ${col.covered} เซลล์ที่มีราคา${col.complete?'':` (มี ${col.of-col.covered} รายการที่ตัวเลือกนี้ไม่มี)`}`,`Sum of ${col.covered} priced cells${col.complete?'':` (${col.of-col.covered} items missing)`}`)]; }
  if(el.dataset.ex!==undefined) return [el.dataset.ex,el.dataset.exb||'',el.dataset.exs||''];
  if(el.id==='nameBox') return [X('ชื่อเซลล์','Cell reference'),X('ตำแหน่งของเซลล์ที่เลือก: ตัวอักษร = คอลัมน์ตัวเลือก, ตัวเลข = แถว','Column letter + row number of the selected cell.'),''];
  if(el.id==='fres') return [X('ผลการอ่านค่า','Parsed value'),X('ค่าที่แอปใช้คำนวณจริงจากสิ่งที่พิมพ์ในเซลล์','The number the app actually uses from what you typed.'),''];
  if(el.classList.contains('lbl')){
    if(el.classList.contains('base')) return [X('ราคาฐาน','Baseline'),X('คอลัมน์ที่ใช้เป็นตัวตั้งในการคิดส่วนต่างทุกช่อง เปลี่ยนได้จากเมนูหัวคอลัมน์','Every difference is measured against this column.'),''];
    if(el.classList.contains('good')) return [X('คุ้มค่าที่สุด / ผ่าน','Best / fits'),X('ตัวเลือกที่ยอดรวมต่ำสุดในบรรดาตัวเลือกที่ใส่ราคาครบ หรือทางเลือกที่อยู่ในงบ','Lowest total among complete stores, or an option within budget.'),''];
    if(el.classList.contains('warn')) return [X('ข้อมูลไม่ครบ','Incomplete'),X('ตัวเลือกนี้ไม่มีราคาบางรายการ ยอดรวมจึงต่ำกว่าความจริงและไม่ถูกนับเป็นตัวเลือกที่ดีที่สุด','Some items are missing, so its total is understated and it is not ranked as best.'),''];
  }
  return null;
}

function explainInfo(el){
  let kind='data', info=null;
  if(el.matches(EX_DATA_SEL)||el.closest('td[data-cell]')) info=exData(el);
  if(!info){ kind='act'; info=el.matches('input[data-f]')?exInput(el):exAct(el.closest('[data-act]')||el); }

  return {kind,title:info[0],body:info[1],src:info[2],trace:!!el.closest('[data-trace]')};
}

/* =====================================================================
   AI BRIDGE — let any AI fill the sheet, and let AI agents drive the app
   1) "Import from AI" dialog: copy a ready prompt → paste the AI's answer (JSON / markdown table / CSV)
   2) Provenance: every AI-filled price keeps its source + check date; cells without a source are flagged
   3) window.PriceCom: a small documented JS API for browser agents
   4) "Copy results for AI": a compact summary to paste back into a chat

/* ---------- parse anything an AI might answer with ---------- */
function aiParse(text){
  let s=String(text||'').trim(); if(!s) return null;
  s=s.replace(/^```[a-z]*\s*/i,'').replace(/```\s*$/,'').trim();
  const a=s.indexOf('{'), b=s.lastIndexOf('}');
  if(a>=0&&b>a){ try{ return normJSON(JSON.parse(s.slice(a,b+1))); }catch(e){} }
  const lines=s.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  if(lines.filter(l=>l.startsWith('|')).length>=2){       /* markdown table */
    const rows=lines.filter(l=>l.startsWith('|')&&!/^\|[\s:|-]+\|?$/.test(l)).map(l=>l.replace(/^\||\|$/g,'').split('|').map(x=>x.trim()));
    return normTable(rows);
  }
  if(lines.length>=2&&lines[0].includes(',')) return normTable(parseCSV(s));
  return null;
}
function normTable(rows){
  if(!rows||rows.length<2||rows[0].length<2) return null;
  const stores=rows[0].slice(1).filter(x=>x&&x!=='#GROUP'), out={sheet:null,stores,items:[]}; let grp=null;
  for(const r of rows.slice(1)){
    if(r[r.length-1]==='#GROUP'||r.slice(1).every(x=>!x)&&r[0]&&rows[0].length>2&&/^\*\*|^#/.test(r[0])){ grp=r[0].replace(/[*#]/g,'').trim(); continue; }
    const prices={}; stores.forEach((st,i)=>{ const v=(r[i+1]||'').replace(/[,฿\s]|บาท/g,''); if(v&&v!=='-'&&v!=='—') prices[st]={raw:v,src:'',at:'',note:''}; });
    out.items.push({name:r[0],group:grp,prices});
  }
  return out;
}
function normJSON(o){
  if(Array.isArray(o)) o={items:o};
  if(!o||!Array.isArray(o.items)) return null;
  const out={sheet:o.sheet||o.name||null,stores:Array.isArray(o.stores)?o.stores.map(String):[],items:[]};
  for(const it of o.items){
    if(!it||!it.name) continue; const prices={};
    const pr=it.prices||{};
    for(const st of Object.keys(pr)){ let x=pr[st];
      if(x===null||x===undefined) continue;
      if(typeof x!=='object') x={value:x};
      if(x.value===null||x.value===undefined||x.value==='') continue;
      prices[st]={raw:String(x.value).replace(/[,฿\s]|บาท/g,''),src:x.source||x.url||'',at:x.checked||x.date||'',note:x.note||''};
      if(!out.stores.includes(st)) out.stores.push(st);
    }
    out.items.push({name:String(it.name),group:it.group?String(it.group):null,prices});
  }
  return out;
}

/* ---------- apply (also used as a dry run for the preview) ---------- */
const fold=s=>String(s||'').trim().toLowerCase();
function aiApply(sh,data,overwrite){
  const st={newStores:0,newItems:0,set:0,skipped:0,unsourced:0,invalid:0};
  sh.meta=sh.meta||{};
  const varOf=name=>{ let v=sh.variables.find(x=>fold(x.name)===fold(name)); if(!v){ v=mkVar(name); sh.variables.push(v); st.newStores++; } return v; };
  data.stores.forEach(varOf);
  for(const it of data.items){
    let row=sh.rows.find(r=>r.type==='item'&&fold(r.name)===fold(it.name));
    if(!row){
      row=mkRow('item',it.name); st.newItems++;
      if(it.group){ let gi=sh.rows.findIndex(r=>r.type==='group'&&fold(r.name)===fold(it.group));
        if(gi<0){ sh.rows.push(mkRow('group',it.group)); sh.rows.push(row); }
        else{ const [,e]=blockRange(sh.rows,gi); sh.rows.splice(e,0,row); } }
      else sh.rows.push(row);
    }
    for(const [name,pv] of Object.entries(it.prices)){
      const v=varOf(name), key=row.id+'|'+v.id;
      if(isValid(parse(row.rawData[v.id]))&&!overwrite){ st.skipped++; continue; }
      if(!isValid(parse(pv.raw))){ st.invalid++; continue; }
      row.rawData[v.id]=pv.raw; sh.meta[key]={by:'ai',src:pv.src,at:pv.at,note:pv.note}; st.set++; if(!pv.src) st.unsourced++;
    }
  }
  if(!sh.baseVarId&&sh.variables[0]) sh.baseVarId=sh.variables[0].id;
  updateVisibility(sh); return st;
}
function aiImport(text,{target='cur',overwrite=false,name}={}){
  const data=aiParse(text); if(!data) return {error:t('AI parse err')};
  let sh=target==='cur'?cur():null;
  if(!sh){ sh=mkSheet(name||data.sheet||t('Imported')); S.sheets.push(sh); S.currentSheetId=sh.id; resetHistory(); }
  /* a fresh blank sheet still holds the placeholders "Item 1" / "Option A" — drop them so AI data starts clean */
  const empty=sh.rows.every(r=>!Object.values(r.rawData).some(x=>String(x).trim()))&&sh.rows.length<=1&&sh.variables.length<=1;
  if(empty){ sh.rows=[]; sh.variables=[]; sh.baseVarId=null; }
  const stats=aiApply(sh,data,overwrite);
  if(!sh.rows.length) sh.rows.push(mkRow('item','Item 1'));
  if(!sh.variables.length) sh.variables.push(mkVar('Option A'));
  S.screen='sheet'; S.view='data'; save(); recompute(); pushHistory();
  return {stats};
}
function aiPreview(text,target,overwrite){
  const data=aiParse(text); if(!data) return null;
  const base=target==='cur'&&cur()?JSON.parse(JSON.stringify(cur())):mkSheet('x');
  return aiApply(base,data,overwrite);
}

/* ---------- export: PriceCom JSON (with sources) + a summary to paste into a chat ---------- */
function sheetJSON(sh){
  const meta=sh.meta||{}; let grp=null; const items=[];
  for(const r of sh.rows){ if(r.type==='group'){ grp=r.name; continue; } const prices={};
    for(const v of sh.variables){ const raw=r.rawData[v.id]; if(raw===undefined||raw==='') continue; const m=meta[r.id+'|'+v.id];
      prices[v.name]=m?{value:raw,source:m.src||null,checked:m.at||null,by:'ai'}:{value:raw}; }
    items.push({name:r.name,group:grp,prices}); }
  return {pricecom:1,sheet:sh.name,stores:sh.variables.map(v=>v.name),baseline:(sh.variables.find(v=>v.id===S.computed.baseVarId)||{}).name||null,items};
}
function resultsJSON(sh){
  const c=calculateSheet(sh,S.highlightMode), name=id=>(sh.variables.find(v=>v.id===id)||{}).name;
  const lensOut=(r)=>({total:r.totalCost,stores:[...new Set(r.picks.filter(p=>p.sourceVarId).map(p=>p.sourceVarName))],picks:r.picks.filter(p=>p.sourceVarId).map(p=>({item:p.rowName,store:p.sourceVarName,price:p.value}))});
  const out={sheet:sh.name,generated:new Date().toISOString().slice(0,16).replace('T',' '),

    best_value:{store:name(c.bestValueVarId)||null,rule:'lowest total among stores that price every item',from_incomplete:c.bestIsIncomplete},
    lens:{L1_global:lensOut(lensGlobal(sh,S.highlightMode)),[`L2_max_${S.lensN}_stores`]:lensOut(lensConstraint(sh,S.lensN,S.highlightMode))}};
  if(S.lensScoped.size) out.lens.L3_scoped=lensOut(lensScoped(sh,S.lensScoped,S.highlightMode));
  const X_=budgetValue(sh); if(X_!==null) out.budget={amount:X_,lens_L1_diff:out.lens.L1_global.total-X_};
  const ai=Object.values(sh.meta||{}); if(ai.length) out.ai_filled={prices:ai.length,without_source:ai.filter(m=>!m.src).length};
  return out;
}

/* ---------- window.PriceCom — API for browser AI agents ---------- */
const AI_MANUAL_SHORT=`PriceCom agent API (window.PriceCom). All prices in THB.
Read:   listSheets() · getSheet(name?) → PriceCom JSON (with sources) · results(name?) → totals, best value, lens baskets, budget
Write:  createSheet(name) · openSheet(name) · import(jsonOrTableText,{target:'current'|'new',overwrite:false}) → stats
        setPrice(item, store, value, {source, checked, group}) · setBudget(amount) · undo()
Lens:   lens(1|2|3,{n, stores:[names]}) → {total, stores, picks:[{item,store,price}]}   (1 = all stores, 2 = at most n stores, 3 = only given stores)
Rules:  value may be a number, an expression "6500+120" or a unit price "199/800". Empty = store does not sell it; 0 = free.
        Always pass a source URL and check date for prices you found — prices without a source are flagged in the UI.
JSON format: ${JSON.stringify(AI_EXAMPLE)}`;
function findSheet(q){ if(!q) return cur(); return S.sheets.find(s=>s.id===q)||S.sheets.find(s=>fold(s.name)===fold(q))||null; }
window.PriceCom={
  version:1, help:()=>aiGuide(), schema:()=>JSON.parse(JSON.stringify(AI_EXAMPLE)),
  listSheets:()=>S.sheets.map(s=>({id:s.id,name:s.name,stores:s.variables.length,items:s.rows.filter(r=>r.type==='item').length,open:!s.isClosed,current:s.id===S.currentSheetId})),
  getSheet:(q)=>{ const sh=findSheet(q); return sh?sheetJSON(sh):null; },
  results:(q)=>{ const sh=findSheet(q); return sh?resultsJSON(sh):null; },
  createSheet:(name)=>{ createSheet('blank'); const sh=cur(); sh.name=name||sh.name; save(); renderAll(); return sh.id; },
  openSheet:(q)=>{ const sh=findSheet(q); if(!sh) return false; switchSheet(sh.id); renderAll(); return true; },
  import:(text,opt)=>{ const r=aiImport(typeof text==='string'?text:JSON.stringify(text),{target:(opt&&opt.target)==='new'?'new':'cur',overwrite:!!(opt&&opt.overwrite)}); renderAll(); return r.error?{error:r.error}:r.stats; },
  setPrice:(item,store,value,o={})=>window.PriceCom.import({items:[{name:item,group:o.group||null,prices:{[store]:{value,source:o.source||null,checked:o.checked||null}}}]},{overwrite:true}),
  setBudget:(x)=>{ const sh=cur(); if(!sh) return false; sh.budget=String(x); commit(); renderAll(); return true; },

    const r=lensFor(sh,(mode||1)-1); return {total:r.totalCost,stores:[...new Set(r.picks.filter(p=>p.sourceVarId).map(p=>p.sourceVarName))],picks:r.picks.filter(p=>p.sourceVarId).map(p=>({item:p.rowName,store:p.sourceVarName,price:p.value}))}; },

/* ---------- the guide lives once, in the HTML comment at the top of the file ---------- */
function aiGuide(){ for(const n of document.childNodes) if(n.nodeType===8&&n.nodeValue.includes('INSTRUCTIONS FOR AI')) return n.nodeValue.trim(); return AI_MANUAL_SHORT; }
const seenSeeds=()=>{ try{ return JSON.parse(LS.get('pricecom_seeds')||'[]'); }catch(e){ return []; } };
const rememberSeed=h=>{ const a=seenSeeds().filter(x=>x!==h); a.push(h); LS.set('pricecom_seeds',JSON.stringify(a.slice(-50))); };
const hashStr=s=>{ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return (h>>>0).toString(36); };
/* JSON an AI wrote into the pricecom-data block (top of <head>) is imported once per distinct content */
function importSeed(){
  const el=$('pricecom-data'); if(!el) return; const raw=el.textContent.trim(); if(!raw) return;
  let data; try{ data=JSON.parse(raw); }catch(e){ console.warn('pricecom-data is not valid JSON'); return; }
  if(!data||!Array.isArray(data.items)||!data.items.length) return;
  const h=hashStr(raw); if(seenSeeds().includes(h)) return;
  const r=aiImport(raw,{target:'new',name:data.sheet||'AI data'}); rememberSeed(h);
  if(!r.error){ renderAll(); flash(t('AI done',r.stats.set)); }
}
/* download the app itself with the current sheet embedded — hand this one file to an AI or another computer */
function exportAppWithData(){
  const sh=cur(); if(!sh) return;
  const doc=document.documentElement.cloneNode(true);
  ['tabstrip','appbar','toolbar','vtabs','main','rail','menu','snack','modal','tip','explain','exbar','aiManual'].forEach(id=>{ const n=doc.querySelector('#'+id); if(n){ n.innerHTML=''; n.removeAttribute('class'); n.removeAttribute('style'); } });
  doc.querySelector('body').removeAttribute('class'); doc.removeAttribute('data-mode');
  const seed=JSON.stringify(sheetJSON(sh),null,1).replace(/<\//g,'<\\/');   /* escape "<" + "/" so a name cannot close the data block */
  doc.querySelector('#pricecom-data').textContent='\n'+seed+'\n';
  let top=''; for(const n of document.childNodes) if(n.nodeType===8) top+='<!--'+n.nodeValue+'-->\n';
  rememberSeed(hashStr(seed.trim()));
  download((sh.name||'pricecom').replace(/[\\/:*?"<>|]+/g,'_').trim()+'.pricecom.html','<!DOCTYPE html>\n'+top+doc.outerHTML,'text/html');
}
