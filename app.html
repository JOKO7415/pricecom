const renderDock=()=>renderSnack();   /* store.js toast timer hook */
function focusSel(sel){ const el=document.querySelector(sel); if(el){ el.focus(); if(el.select) el.select(); el.scrollIntoView({block:'nearest',inline:'nearest'}); } }
function applyTheme(){ const dark=S.theme==='dark'||(S.theme==='system'&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches); document.documentElement.dataset.mode=dark?'dark':'light'; }
if(window.matchMedia) try{ matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{ applyTheme(); renderAppbar(); }); }catch(e){}
function insertBelow(id){ const sh=cur(); const i=sh.rows.findIndex(r=>r.id===id); if(i<0) return null; const r=mkRow('item','New Item'); sh.rows.splice(i+1,0,r); commit(); return r; }
function exportSheet(sh){ if(sh) download((sh.name||'export').replace(/[\\/:*?"<>|]+/g,'_').trim()+'.csv',generateCSV(sh)); }

document.addEventListener('click',e=>{
  if(e.target.id==='railScrim'){ S.railOpen=false; renderVTabs(); return; }
  const inMenu=e.target.closest('#menu');
  const el=e.target.closest('[data-act]');
  if(!el){ if(S.menu&&!inMenu) closeMenu(); if(e.target.id==='modal'&&S.modal){ S.modal=null; renderModal(); } return; }
  if(el.disabled) return;
  const a=el.dataset.act, D=el.dataset, id=D.id;
  const menuKinds={mbar:D.m,tbMenu:D.m,colMenu:'col',rowMenu:'row',tabMenu:'tab',cardMenu:'card',allSheets:'all',mbarAll:'mall'};
  if(a in menuKinds){ e.stopPropagation(); const wasSame=S.menu&&S.menu.anchor===el; closeMenu(); if(!wasSame) openMenu(menuKinds[a],id,el); return; }
  if(S.menu) closeMenu();
  switch(a){
    case 'trace': hideExplain(); doTrace(D.trace,D.tl); break;
    case 'traceClear': clearTrace(); break;
    case 'explainToggle': S.explain=!S.explain; S.exPin=null; renderAppbar(); renderExplainBar(); break;
    case 'aiOpen': S.modal={type:'ai',target:D.k==='new'||!cur()?'new':'cur',task:'',paste:'',overwrite:false}; renderModal(); break;
    case 'aiTarget': S.modal.target=D.k; renderModal(); break;
    case 'aiCopyPrompt': copyText($('aiPrompt').value).then(()=>{ el.innerHTML=ic('check')+esc(t('Copied')); }); break;
    case 'aiApply': { const m=S.modal; const r=aiImport(m.paste,{target:m.target,overwrite:m.overwrite,name:m.task||null}); if(r.error){ renderModal(); break; } S.modal=null; renderAll(); flash(t('AI done',r.stats.set)); break; }
    case 'aiCopyResults': { const sh=cur(); if(sh) copyText(aiSummaryText(sh)).then(()=>flash(t('Copied'))); break; }
    case 'exportJSON': { const sh=cur(); if(sh) download((sh.name||'export').replace(/[\\/:*?"<>|]+/g,'_').trim()+'.pricecom.json',JSON.stringify(sheetJSON(sh),null,1),'application/json'); break; }
    case 'exportApp': exportAppWithData(); break;
    case 'aiGuide': S.modal={type:'guide'}; renderModal(); break;
    case 'aiCopyGuide': copyText(aiGuide()).then(()=>{ el.innerHTML=ic('check')+esc(t('Copied')); }); break;
    case 'goHome': S.screen='home'; S.active=null; renderAll(); break;
    case 'view': S.view=D.k; S.screen='sheet'; if(innerWidth<=760) S.railOpen=false; renderAll(); break;
    case 'openPanel': S.railOpen=true; if(innerWidth>760) LS.set('railOpen','1'); renderVTabs(); { const f=$('budgetIn'); if(f&&S.view==='budget') f.focus(); } break;
    case 'baseSet': S.baselineCollapsed=D.k==='1'; renderVTabs(); renderMain(); break;
    case 'railToggle': S.railOpen=!S.railOpen; if(innerWidth>760) LS.set('railOpen',S.railOpen?'1':'0'); renderVTabs(); break;
    case 'openTab': {
      /* the tab is re-rendered on the first click, so a native dblclick never fires — detect it by timing instead */
      const now=Date.now(), dbl=S.lastTab&&S.lastTab.id===id&&now-S.lastTab.t<450; S.lastTab={id,t:now};
      if(id===S.currentSheetId&&S.screen==='sheet'&&!dbl) break;
      if(id!==S.currentSheetId){ switchSheet(id); S.view='data'; } S.screen='sheet'; renderAll();
      if(dbl) focusSel('#docTitle'); break; }
    case 'openSheet': if(id!==S.currentSheetId||S.screen!=='sheet'){ switchSheet(id); } renderAll(); break;
    case 'closeTab': closeSheet(id); renderAll(); break;
    case 'renameTab': if(id!==S.currentSheetId) switchSheet(id); S.screen='sheet'; renderAll(); focusSel('#docTitle'); break;
    case 'undo': undo(); break;
    case 'redo': redo(); break;
    case 'addCol': { if(S.view!=='data'){ S.view='data'; } const v=addVariable(); renderAll(); if(v) focusSel(`input[data-f="varname"][data-v="${v.id}"]`); break; }
    case 'addItem': { S.view='data'; const r=addRow('item'); renderAll(); if(r) focusSel(`input[data-f="rowname"][data-r="${r.id}"]`); break; }
    case 'addGroup': { S.view='data'; const r=addRow('group'); renderAll(); if(r) focusSel(`input[data-f="rowname"][data-r="${r.id}"]`); break; }
    case 'insertBelow': { const r=insertBelow(id); renderAll(); if(r) focusSel(`input[data-f="rowname"][data-r="${r.id}"]`); break; }
    case 'csvExport': exportSheet(cur()); break;
    case 'exportSheet': exportSheet(S.sheets.find(s=>s.id===id)); break;
    case 'csvImport': S.modal=null; renderModal(); $('csvFile').click(); break;
    case 'sortSet': S.sortConfig={axis:D.axis,ascending:D.asc==='1',varId:D.vid,rowId:D.rid}; renderToolbar(); renderMain(); break;
    case 'sortClear': e.stopPropagation(); S.sortConfig=null; renderToolbar(); renderMain(); break;
    case 'hlSet': S.highlightMode=S.highlightMode===D.mode?'none':D.mode;   /* pick the active mode again = off */ recompute(); renderToolbar(); renderMain(); renderSheetbar(); break;
    case 'hlClear': e.stopPropagation(); S.highlightMode='none'; recompute(); renderToolbar(); renderMain(); renderSheetbar(); break;
    case 'toggleGroup': toggleGroup(id); renderAll(); break;
    case 'resGroup': if(S.resGroupsCollapsed.has(id)) S.resGroupsCollapsed.delete(id); else S.resGroupsCollapsed.add(id); renderMain(); break;
    case 'setBase': setBase(id); renderAll(); break;
    case 'dupVar': duplicateVariable(id); renderAll(); break;
    case 'delVar': deleteVariable(id); renderAll(); break;
    case 'dupRow': duplicateRow(id); renderAll(); break;
    case 'delRow': deleteRow(id); renderAll(); break;
    case 'baseCollapse': S.baselineCollapsed=!S.baselineCollapsed; renderVTabs(); renderMain(); break;
    case 'lensMode': S.lensMode=+D.i; renderMain(); renderVTabs(); break;
    case 'lensN': S.lensN=S.lensN+(+D.d); renderMain(); renderVTabs(); break;
    case 'lensScope': if(S.lensScoped.has(id)) S.lensScoped.delete(id); else S.lensScoped.add(id); renderMain(); renderVTabs(); break;
    case 'newSheet': S.modal={type:'templates'}; renderModal(); break;
    case 'createFrom': createSheet(D.k); S.modal=null; renderAll(); break;
    case 'dupSheet': duplicateSheet(id); S.screen='sheet'; S.view='data'; renderAll(); break;
    case 'delSheet': deleteSheet(id); renderAll(); break;
    case 'dismissToast': dismissToast(); break;
    case 'undoDelete': undoDelete(); break;
    case 'modalClose': S.modal=null; renderModal(); break;
    case 'disableSort': S.sortConfig=null; S.modal=null; renderAll(); break;
    case 'openSettings': S.modal={type:'settings'}; renderModal(); break;
    case 'toggleDark': S.theme=document.documentElement.dataset.mode==='dark'?'light':'dark'; LS.set(KEY_THEME,S.theme); applyTheme(); renderAppbar(); break;
    case 'setTheme': S.theme=D.k; LS.set(KEY_THEME,D.k); applyTheme(); renderAppbar(); renderModal(); break;
    case 'setLang': LANG=D.k; LS.set(KEY_LANG,LANG); document.documentElement.lang=LANG; renderAll(); break;
    case 'resetSample': createSheet('pc'); S.modal=null; renderAll(); break;
  }
});
/* Chrome-style tab gestures: middle-click closes, double-click renames */
document.addEventListener('auxclick',e=>{ const tb=e.button===1&&e.target.closest('.ctab[data-id]'); if(tb){ e.preventDefault(); closeSheet(tb.dataset.id); renderAll(); } });
document.addEventListener('mousedown',e=>{ if(e.button===1&&e.target.closest('.ctab[data-id]')) e.preventDefault(); });
document.addEventListener('contextmenu',e=>{
  const pt={x:e.clientX,y:e.clientY}; let k=null,id=null,n;
  if((n=e.target.closest('th.g-num[data-num]'))){ k='row'; id=n.dataset.num; }
  else if((n=e.target.closest('.colstrip[data-strip]'))){ k='col'; id=n.dataset.strip; }
  else if((n=e.target.closest('.ctab[data-id]'))){ k='tab'; id=n.dataset.id; }
  else if((n=e.target.closest('.dcard'))){ k='card'; id=n.querySelector('[data-id]').dataset.id; }
  else if((n=e.target.closest('td.g-name[data-rowlabel]'))&&e.target.tagName!=='INPUT'){ k='row'; id=n.dataset.rowlabel; }
  if(!k) return; e.preventDefault(); closeMenu(); openMenu(k,id,null,pt);
});
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&!e.altKey&&e.key.toLowerCase()==='f'&&S.screen==='sheet'){ const q=[$('q'),$('q2')].find(x=>x&&x.offsetParent); if(q){ e.preventDefault(); q.focus(); q.select(); return; } }
  if(e.key==='Escape'&&e.target.dataset&&e.target.dataset.f==='search'){ e.target.value=''; S.searchQuery=''; ['q','q2'].forEach(k=>{const o=$(k); if(o) o.value='';}); e.target.blur(); if(S.view==='data') refreshDerived(); else renderMain(); return; }
  if(e.key==='Escape'&&!S.menu&&!S.modal&&(S.explain||S.trace)){ if(S.explain){ S.explain=false; renderAppbar(); renderExplainBar(); } else clearTrace(); return; }
  if(e.key==='Escape'){ if(S.menu){ const a=S.menu.anchor; closeMenu(); if(a) a.focus(); } else if(S.modal){ S.modal=null; renderModal(); } return; }
  if(S.menu&&(e.key==='ArrowDown'||e.key==='ArrowUp')){
    const bs=[...$('menu').querySelectorAll('button:not(:disabled)')], i=bs.indexOf(document.activeElement);
    const j=e.key==='ArrowDown'?(i+1)%bs.length:(i-1+bs.length)%bs.length; if(bs[j]){ e.preventDefault(); bs[j].focus(); } return;
  }
  const tg=e.target;
  if(tg.classList&&tg.classList.contains('ctab')&&(e.key==='Enter'||e.key===' ')){ e.preventDefault(); tg.click(); return; }
  if(tg.classList&&tg.classList.contains('cell')){
    const col=[...document.querySelectorAll(`input.cell[data-v="${tg.dataset.v}"]`)], i=col.indexOf(tg);
    const row=[...document.querySelectorAll(`input.cell[data-r="${tg.dataset.r}"]`)], k=row.indexOf(tg);
    let nx=null;
    if(e.key==='ArrowDown'||(e.key==='Enter'&&!e.shiftKey)) nx=col[i+1];
    else if(e.key==='ArrowUp'||(e.key==='Enter'&&e.shiftKey)) nx=col[i-1];
    else if(e.key==='ArrowRight'&&tg.selectionStart===tg.value.length&&tg.selectionEnd===tg.value.length) nx=row[k+1];
    else if(e.key==='ArrowLeft'&&tg.selectionStart===0&&tg.selectionEnd===0) nx=row[k-1];
    if(nx){ e.preventDefault(); nx.focus(); nx.select(); } return;
  }
  if(tg.id==='fx'&&e.key==='Enter'){ e.preventDefault(); save(); pushHistory(); updateUndoButtons(); const A=S.active;
    if(A&&A.r&&A.v){ const col=[...document.querySelectorAll(`input.cell[data-v="${A.v}"]`)], cur_=document.querySelector(`input.cell[data-r="${A.r}"][data-v="${A.v}"]`), nx=col[col.indexOf(cur_)+1]||cur_; if(nx){ nx.focus(); nx.select(); } }
    return; }
  if(tg.id==='docTitle'&&e.key==='Enter'){ tg.blur(); return; }
  const typing=tg.tagName==='INPUT'||tg.tagName==='TEXTAREA'||tg.isContentEditable;
  if(!typing&&(e.ctrlKey||e.metaKey)&&!e.altKey){ const k=e.key.toLowerCase();
    if(k==='z'&&!e.shiftKey){ e.preventDefault(); undo(); } else if(k==='y'||(k==='z'&&e.shiftKey)){ e.preventDefault(); redo(); } }
});
document.addEventListener('input',e=>{
  const el=e.target, f=el.dataset&&el.dataset.f; if(!f) return; const sh=cur();
  if(f==='cell'){ setRaw(el.dataset.r,el.dataset.v,el.value); refreshDerived(); syncFormula(); }
  else if(f==='rowname'){ const r=sh.rows.find(x=>x.id===el.dataset.r); if(r){ r.name=el.value; save(); if(S.searchQuery) refreshDerived(); syncFormula(); } }
  else if(f==='varname'){ const v=sh.variables.find(x=>x.id===el.dataset.v); if(v){ v.name=el.value; save(); if(S.searchQuery) refreshDerived(); syncFormula(); renderSheetbar(); } }
  else if(f==='sheetname'){ sh.name=el.value; save(); renderSheetbar(); document.title=(sh.name||'')+' — PriceCom'; }
  else if(f==='search'){ S.searchQuery=el.value; ['q','q2'].forEach(k=>{ const o=$(k); if(o&&o!==el) o.value=el.value; }); if(S.view==='data') refreshDerived(); else renderMain(); }
  else if(f==='budget'){ sh.budget=el.value; save(); if(S.view==='budget') renderMain(); }
  else if(f==='aiTask'){ S.modal.task=el.value; const pr=$('aiPrompt'); if(pr) pr.value=aiPrompt(S.modal.target,el.value); }
  else if(f==='aiPaste'){ S.modal.paste=el.value; const keep=el.selectionStart; renderModal(); const p=$('aiPaste'); if(p){ p.focus(); p.setSelectionRange(keep,keep); } }
  else if(f==='homesearch'){ S.homeQuery=el.value; renderMain(); }
  else if(f==='fx'){
    const A=activeRef(); if(!A) return;
    if(A.kind==='cell'){ setRaw(A.row.id,A.v.id,el.value); const gi=document.querySelector(`input.cell[data-r="${A.row.id}"][data-v="${A.v.id}"]`); if(gi) gi.value=el.value; refreshDerived(); }
    else if(A.kind==='row'){ A.row.name=el.value; save(); const gi=document.querySelector(`input[data-f="rowname"][data-r="${A.row.id}"]`); if(gi) gi.value=el.value; }
    else { A.v.name=el.value; save(); const gi=document.querySelector(`input[data-f="varname"][data-v="${A.v.id}"]`); if(gi) gi.value=el.value; renderSheetbar(); }
    syncFormula(true);
  }
});
document.addEventListener('change',e=>{
  const f=e.target.dataset&&e.target.dataset.f; if(!f) return;
  if(['cell','rowname','varname','sheetname','fx','budget'].includes(f)){ save(); pushHistory(); updateUndoButtons(); }
  else if(f==='aiOverwrite'){ S.modal.overwrite=e.target.checked; renderModal(); }
});
document.addEventListener('focusin',e=>{
  const el=e.target, f=el.dataset&&el.dataset.f; let next=null;
  if(f==='cell') next={r:el.dataset.r,v:el.dataset.v}; else if(f==='rowname') next={r:el.dataset.r}; else if(f==='varname') next={v:el.dataset.v};
  if(next){ S.active=next; syncSelection(); syncFormula(); }
});

/* drag & drop reorder (row numbers / column letters are the handles; groups move as a block) */
function clearDrop(){ document.querySelectorAll('.drop').forEach(n=>n.classList.remove('drop')); }
document.addEventListener('dragstart',e=>{
  const h=e.target.closest&&e.target.closest('[data-dragrow],[data-dragvar]'); if(!h) return;
  if(S.sortConfig){ e.preventDefault(); S.modal={type:'confirmSort'}; renderModal(); return; }
  S.drag=h.dataset.dragrow?{kind:'row',id:h.dataset.dragrow}:{kind:'var',id:h.dataset.dragvar};
  e.dataTransfer.effectAllowed='move'; try{ e.dataTransfer.setData('text/plain',S.drag.id); }catch(x){}
});
document.addEventListener('dragover',e=>{ if(!S.drag) return; const tg=S.drag.kind==='row'?e.target.closest('tr[data-row]'):e.target.closest('th[data-var]'); if(tg){ e.preventDefault(); e.dataTransfer.dropEffect='move'; clearDrop(); tg.classList.add('drop'); } });
document.addEventListener('drop',e=>{
  if(!S.drag) return; const d=S.drag, tg=d.kind==='row'?e.target.closest('tr[data-row]'):e.target.closest('th[data-var]');
  clearDrop(); S.drag=null; if(!tg) return; e.preventDefault();
  if(d.kind==='row') moveRow(d.id,tg.dataset.row); else moveVariable(d.id,tg.dataset.var); renderAll();
});
document.addEventListener('dragend',()=>{ clearDrop(); S.drag=null; });

/* M3 plain tooltips */
const tip=$('tip'); let tipTimer=null, tipEl=null;
function placeTip(el){ const r=el.getBoundingClientRect(); tip.style.display='block'; const w=tip.offsetWidth,h=tip.offsetHeight;
  let x=r.left+r.width/2-w/2, y=r.bottom+6; if(y+h>innerHeight-4) y=r.top-h-6; x=Math.max(4,Math.min(x,innerWidth-w-4)); tip.style.left=x+'px'; tip.style.top=y+'px'; }
document.addEventListener('mouseover',e=>{
  const el=e.target.closest&&e.target.closest('[data-tip]'); if(el===tipEl) return;
  clearTimeout(tipTimer); tip.style.display='none'; tipEl=el; if(!el||S.menu||S.explain) return;
  tip.textContent=el.dataset.tip; const chart=el.matches('.dotm,circle,.bar');
  tipTimer=setTimeout(()=>placeTip(el),chart?0:450);
});
document.addEventListener('mousedown',()=>{ clearTimeout(tipTimer); tip.style.display='none'; });
window.addEventListener('scroll',ev=>{ tip.style.display='none'; if(S.menu&&!S.menu.anchor&&ev.target!==$('menu')&&Date.now()-S.menu.at>200) closeMenu(); },true);
window.addEventListener('resize',()=>closeMenu());

/* explain mode: hover shows the card; on touch the first tap explains and the second tap acts */
document.addEventListener('mouseover',e=>{ if(!S.explain) return; const el=exTarget(e.target); if(el) showExplain(el); else hideExplain(); });
document.addEventListener('pointerdown',e=>{ if(!S.explain||e.pointerType!=='touch') return; const el=exTarget(e.target); if(el&&el!==S.exPin){ S.exPin=el; S.exBlock=true; showExplain(el); } else S.exBlock=false; },true);
document.addEventListener('click',e=>{ if(S.exBlock){ S.exBlock=false; e.preventDefault(); e.stopPropagation(); } },true);

/* csv file picker */
$('csvFile').addEventListener('change',async e=>{
  const f=e.target.files&&e.target.files[0]; e.target.value=''; if(!f) return;
  const show=r=>{ S.modal=r.error?{type:'msg',title:t('Import Failed'),text:r.error}:(r.warn?{type:'msg',title:t('Import Completed With Notes'),text:r.warn}:null); };
  try{ const buf=await f.arrayBuffer(); let text; try{ text=new TextDecoder('utf-8',{fatal:true}).decode(buf); }catch(x){ text=new TextDecoder('windows-874').decode(buf); } if(/\.json$/i.test(f.name)){ const r=aiImport(text,{target:'new',name:f.name.replace(/(\.pricecom)?\.json$/i,'')}); S.modal=r.error?{type:'msg',title:t('Import Failed'),text:r.error}:null; } else show(importCSV(text,f.name)); }
  catch(err){ S.modal={type:'msg',title:t('Import Failed'),text:t('File Read Error')}; }
  renderAll();
});

/* ---------- boot ---------- */
(function boot(){
  LANG=LS.get(KEY_LANG)||'th';
  S.theme=LS.get(KEY_THEME)||'system';
  S.railOpen=innerWidth>760?LS.get('railOpen')!=='0':false; S.trace=null; S.explain=false; document.documentElement.lang=LANG; applyTheme();
  if(!load()){ const sh=presetPC(); updateVisibility(sh); S.sheets=[sh]; S.currentSheetId=sh.id; save(); }
  const c=cur(); S.screen=c&&!c.isClosed?'sheet':'home'; S.view='data';
  recompute(); resetHistory(); pushHistory(); renderAll();
  /* AI guide moved to ai.txt */
  importSeed();
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>refreshDerived());
})();

<style>#bestslot{display:none!important}
#qbar{position:sticky;top:0;z-index:30;margin:8px 12px 4px;display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:0;
 background:#1f1f1f;color:#e8eaed;border-radius:28px;padding:6px;box-shadow:0 2px 6px rgba(0,0,0,.25),0 6px 16px rgba(0,0,0,.18);font-size:14px}
:root[data-mode="dark"] #qbar{background:#3c4043;color:#e8eaed;box-shadow:0 0 0 1px rgba(255,255,255,.12),0 6px 16px rgba(0,0,0,.5)}
#qbar .q{display:flex;align-items:center;gap:10px;min-width:0;padding:6px 12px;border-radius:22px;cursor:pointer}
#qbar .q:hover{background:rgba(255,255,255,.08)}
#qbar .q .lbl{font-size:10.5px;letter-spacing:.06em;opacity:.6;font-weight:600;flex:none}
#qbar .q .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
#qbar .q .car{opacity:.7;flex:none}
#qbar .a{display:flex;align-items:center;gap:10px;padding:4px 16px;border-left:1px solid rgba(255,255,255,.18);border-right:1px solid rgba(255,255,255,.18);white-space:nowrap}
#qbar .a .lbl{font-size:10.5px;letter-spacing:.06em;opacity:.6;font-weight:600}
#qbar .a .v{font-family:var(--mono);font-weight:700;font-size:16px;color:#fdd663;text-decoration:underline dashed;text-underline-offset:4px;text-decoration-thickness:1px;cursor:pointer}
#qbar .a .s{opacity:.8}
#qbar .a.na .v{color:#f28b82;text-decoration:none;font-family:inherit;font-size:14px}
#qbar .m{display:flex;background:rgba(255,255,255,.1);border-radius:22px;padding:3px;margin-left:8px}
#qbar .m button{height:34px;padding:0 14px;border-radius:18px;color:inherit;opacity:.75;font-size:13px;font-weight:500;white-space:nowrap}
#qbar .m button.on{background:#fdd663;color:#1f1f1f;opacity:1}
#qmenu{position:absolute;z-index:40;background:#2d2e30;color:#e8eaed;border-radius:16px;padding:6px;box-shadow:0 8px 24px rgba(0,0,0,.35);min-width:420px}
#qmenu div{padding:10px 14px;border-radius:10px;cursor:pointer;display:flex;gap:12px}
#qmenu div:hover,#qmenu div.on{background:rgba(255,255,255,.1)}
#qmenu small{opacity:.55;min-width:62px}
@media (max-width:760px){
 #qbar{grid-template-columns:1fr auto;border-radius:20px;margin:6px 8px}
 #qbar .q{grid-column:1/-1}
 #qbar .a{border-left:none;padding-left:12px}
 #qbar .m{grid-column:1/-1;margin:4px 0 0}
 #qbar .m button{flex:1;padding:0 8px;font-size:12.5px}
 #qbar .a{border-right:none}
}
#rail,#railScrim{display:none!important}
#qbar.mini{grid-template-columns:auto auto;justify-self:center;width:max-content;margin:8px auto 4px;padding:4px 6px 4px 4px}
#qbar.mini .q,#qbar.mini .m{display:none}
#qbar.mini .a{border:none;padding:4px 10px}
#qbar .fold{width:34px;height:34px;border-radius:17px;color:inherit;opacity:.7;margin-left:4px;font-size:16px}
#qbar .fold:hover{background:rgba(255,255,255,.1);opacity:1}
#qbar{grid-template-columns:minmax(0,1fr) auto auto auto}
#bbar{flex:none;display:flex;align-items:center;gap:12px;padding:8px 12px;border-top:1px solid var(--outline-var);background:var(--bg);position:relative}
#bbar .seg{display:flex;background:var(--surface-2,rgba(0,0,0,.05));border-radius:22px;padding:3px;gap:2px}
#bbar .seg button{height:36px;padding:0 16px;border-radius:18px;font-weight:500;font-size:13.5px;color:var(--on-surface-var);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
#bbar .seg button.on{background:var(--secondary-container,#d3e3fd);color:var(--on-surface)}
#bbar .sp{flex:1}
#bbar .opt{height:36px;padding:0 16px;border-radius:18px;border:1px solid var(--outline);display:inline-flex;align-items:center;gap:6px;font-weight:500;font-size:13.5px;color:var(--on-surface)}
#bbar .opt.on{background:var(--secondary-container,#d3e3fd)}
#bsheet{position:absolute;left:12px;right:12px;bottom:calc(100% + 8px);background:var(--surface,#fff);border-radius:20px;box-shadow:0 8px 28px rgba(0,0,0,.22);padding:12px 16px;display:flex;flex-wrap:wrap;gap:8px 28px;z-index:35}
#bsheet .rsec{min-width:220px;flex:0 1 auto;padding:4px 0}
@media (max-width:760px){
 #bbar{gap:8px;padding:6px 8px}
 #bbar .seg button{padding:0 10px;font-size:12.5px}
 #bbar .opt span.l{display:none}
 #bbar .opt{padding:0 10px}
 #bsheet{left:8px;right:8px;flex-direction:column}
}
#qbar.mini .fold{margin-left:0}
td.qa{background:color-mix(in srgb,#fdd663 22%,transparent)!important;box-shadow:inset 0 0 0 2px #fdd663}
td.qa .v,td.qa input{font-weight:700}
.sg td.qdim>*{opacity:.28}
th.qcol{box-shadow:inset 0 -3px 0 #fdd663}
#qbar .dimlab{display:flex;align-items:center;gap:8px;margin-left:8px;padding:0 14px;height:40px;border-radius:20px;background:rgba(255,255,255,.1);white-space:nowrap;font-size:13px}
#qbar .dimlab b{color:#fdd663}
#bbar .seg.dims button.on{background:#fdd663;color:#1f1f1f}
#bbar .seg.dims .add{font-weight:700;padding:0 12px}
input.cname{display:block;width:100%;border:0;background:transparent;font-size:10.5px;color:var(--on-surface-var);padding:0 6px;height:16px;text-align:left;font-family:inherit;opacity:.85}
input.cname::placeholder{opacity:.35}
input.cname:focus{outline:1px solid var(--primary);border-radius:4px;opacity:1}
.cn{font-size:10.5px;color:var(--on-surface-var);text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px;margin-bottom:2px}
body.noagg [data-tot],body.noagg .sg thead .tt,body.noagg .sg thead .pc,body.noagg td[data-trace^="group:"] .rv,body.noagg .lbl.good{visibility:hidden}
body.noagg th.bestcol{background:none!important}
.dimset{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.dimset label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--on-surface-var)}
.dimset input,.dimset select{height:34px;border:1px solid var(--outline);border-radius:8px;padding:0 8px;background:var(--bg);color:var(--on-surface);font-family:inherit}
.demo-note{font-size:11px;color:#c5221f;padding:2px 12px}
body.dirmax .dchip.up{background:var(--success-container);color:var(--success)}
body.dirmax .dchip.down{background:var(--error-container);color:var(--error)}
body.dirmax .rhead .pc.up{color:var(--success)} body.dirmax .rhead .pc.down{color:var(--error)}
#qbar .t{display:inline-flex;align-items:center;gap:6px;flex-wrap:nowrap}
.qp{display:inline-flex;align-items:center;gap:2px;background:#fdd663;color:#1f1f1f;border-radius:16px;padding:2px;font-weight:700}
.qp button{width:26px;height:26px;border-radius:13px;font-size:16px;line-height:1;color:inherit;display:grid;place-items:center}
.qp button:hover:not(:disabled){background:rgba(0,0,0,.12)}
.qp button:disabled{opacity:.3}
.qp b{min-width:18px;text-align:center;font-family:var(--mono)}
.qp.pick{padding:3px 10px;cursor:pointer;gap:4px}
#qstores{position:absolute;z-index:45;background:#2d2e30;color:#e8eaed;border-radius:16px;padding:10px;box-shadow:0 8px 24px rgba(0,0,0,.35);display:flex;flex-wrap:wrap;gap:6px;max-width:460px}
#qstores button{height:32px;padding:0 12px;border-radius:16px;border:1px solid rgba(255,255,255,.25);color:inherit;font-size:13px}
#qstores button.on{background:#fdd663;color:#1f1f1f;border-color:#fdd663}
#qstores .hd{width:100%;font-size:12px;opacity:.7;margin-bottom:2px}
</style><script>function dims(sh){ sh=sh||cur(); if(!sh) return [{id:'price',name:'ราคา',dir:'min',agg:'sum'}]; if(!sh.dims) sh.dims=[{id:'price',name:'ราคา',dir:'min',agg:'sum'}]; if(!sh.curDim) sh.curDim='price'; return sh.dims; }
function curDim(sh){ sh=sh||cur(); const d=dims(sh); return d.find(x=>x.id===sh.curDim)||d[0]; }
const W=()=>{ const d=curDim(); if(d.id==='price') return d.dir==='max'?'แพงที่สุด':'ถูกที่สุด'; return (d.dir==='max'?'มากที่สุด':'น้อยที่สุด'); };
window.QP={mode:'min',forceNA:false,menu:false,mini:false,q:'one',opt:false};
const QS=[
 {k:'one', v:'grid', lab:'ตัวเลือกเดียว', q:()=>'ซื้อครบจากตัวเลือกเดียว ตัวเลือกไหน'+(curDim().id==='price'?'รวมแล้ว':curDim().name+'รวม')+W()+'?'},
 {k:'l1', v:'grid', lm:0, lab:'L1', q:()=>'แต่ละชิ้นซื้อคนละตัวเลือกได้ '+(curDim().id==='price'?'รวมแล้ว'+W()+'เท่าไหร่?':'เลือกตัวที่'+curDim().name+W()+'ของแต่ละแถว')},
 {k:'l2', v:'grid', lm:1, lab:'L2', q:()=>`ไปได้แค่ ${S.lensN} ตัวเลือก ซื้อครบ${W()}เท่าไหร่?`, qh:()=>{ const n=S.lensN, V=(cur()||{variables:[]}).variables.length; return `ไปได้แค่ <span class="qp" onclick="event.stopPropagation()"><button aria-label="ลดจำนวนตัวเลือก" ${n<=1?'disabled':''} onclick="qN(-1)">−</button><b>${n}</b><button aria-label="เพิ่มจำนวนตัวเลือก" ${n>=V?'disabled':''} onclick="qN(1)">+</button></span> ตัวเลือก ซื้อครบ${W()}เท่าไหร่?`; }},
 {k:'l3', v:'grid', lm:2, lab:'L3', q:()=>'เฉพาะตัวเลือกที่ฉันเลือก ซื้อครบ'+W()+'เท่าไหร่?', qh:()=>`เฉพาะ <span class="qp pick" onclick="event.stopPropagation();QP.stores=!QP.stores;drawQ()">${S.lensScoped.size?S.lensScoped.size+' ตัวเลือกที่เลือก':'เลือกตัวเลือก'} ▾</span> ซื้อครบ${W()}เท่าไหร่?`},
 {k:'bud', v:'budget', lab:'งบ', q:()=>'งบเท่านี้ ตัวเลือกไหน/ตะกร้าไหนพอ?'},

function curQ(){ if(/^l/.test(QP.q)) return QS[1+S.lensMode]; return QS.find(x=>x.k===QP.q)||QS[0]; }
function qMode(){ return curDim().dir==='max'?'max':'min'; }
function qResult(sh){ const q=curQ(), c=S.computed, D=curDim(sh);
  if(q.k==='one'&&D.agg==='none') return {na:'มิติ "'+D.name+'" ไม่รวมยอด — ลองคำถาม L1'};
  if(q.k==='one'){ const ids=sh.variables.filter(v=>c.cols[v.id]&&c.cols[v.id].complete).map(v=>v.id); if(!ids.length) return {na:'ยังตอบไม่ได้ — ไม่มีตัวเลือกไหนมีราคาครบ'};
    const pick=ids.reduce((a,b)=>qMode()==='max'?(c.subtotals[b]>c.subtotals[a]?b:a):(c.subtotals[b]<c.subtotals[a]?b:a));
    const cells=new Set(); sh.rows.forEach(r=>{ if(r.type==='item') cells.add(r.id+'|'+pick); }); return {cells,col:pick,total:c.subtotals[pick],label:sh.variables.find(v=>v.id===pick).name}; }
  if(/^l/.test(q.k)){ if(S.lensMode===2&&!S.lensScoped.size) return {na:'แตะ “เลือกตัวเลือก” ในคำถามก่อน'};
    const res=S.lensMode===1?lensConstraint(sh,Math.max(1,Math.min(S.lensN,sh.variables.length)),qMode()):S.lensMode===2?lensScoped(sh,S.lensScoped,qMode()):lensGlobal(sh,qMode());

    const used=[...new Set(res.picks.filter(p=>p.sourceVarId).map(p=>p.sourceVarId))].map(id=>sh.variables.find(v=>v.id===id).name);
    return {cells,total:D.agg==='none'?null:res.totalCost,label:D.agg==='none'?cells.size+' ช่อง':(used.length<=2?used.join(' + '):used.length+' ตัวเลือก')}; }
  return null; }
function applyQ(){ const sh=cur(); if(!sh||S.screen!=='sheet'||(S.view!=='table'&&S.view!=='data')) return; const r=qResult(sh); if(!r||r.na) return;
  document.querySelectorAll('.sg tbody tr').forEach(tr=>{ tr.querySelectorAll('td[data-cell],td[data-trace^="cell:"]').forEach(td=>{
     const k=td.dataset.cell||td.dataset.trace.slice(5).replace(':','|'); td.classList.toggle('qa',r.cells.has(k)); td.classList.toggle('qdim',!r.cells.has(k)); }); });
  if(r.col) document.querySelectorAll('.sg thead th').forEach(th=>{ if((th.dataset.trace||'')==='col:'+r.col) th.classList.add('qcol'); }); }

function ansHTML(sh){
  { const r=qResult(sh); if(r){ if(r.na) return `<div class="a na"><span class="lbl">คำตอบ</span><span class="v">${esc(r.na)}</span></div>`;
     return `<div class="a"><span class="lbl">คำตอบ</span><span class="s">${esc(r.label)}</span>${r.total==null?'':`<span class="v">${fmt(r.total)}</span>`}</div>`; } }
  const c=S.computed; const q=curQ();
  if(QP.forceNA) return `<div class="a na"><span class="lbl">คำตอบ</span><span class="v">ยังตอบไม่ได้ — ไม่มีตัวเลือกไหนมีราคาครบ</span></div>`;
  if(q.k==='one'){ const bv=sh.variables.find(v=>v.id===c.bestValueVarId); if(!bv) return `<div class="a na"><span class="lbl">คำตอบ</span><span class="v">ยังไม่มีข้อมูล</span></div>`;
    return `<div class="a"><span class="lbl">คำตอบ</span><span class="s">${esc(bv.name)}</span><span class="v" ${trA('best','best')}>${fmt(c.subtotals[bv.id])}</span></div>`; }
  if(q.v==='lens'){ const L=lensCompute(sh); if(!L.hasData) return `<div class="a na"><span class="lbl">คำตอบ</span><span class="v">ยังไม่มีข้อมูล</span></div>`;
    const used=[...new Set(L.res.picks.filter(p=>p.sourceVarId).map(p=>p.sourceVarId))].map(id=>sh.variables.find(v=>v.id===id).name);
    return `<div class="a"><span class="lbl">คำตอบ</span><span class="s">${used.length<=2?esc(used.join(' + ')):used.length+' ตัวเลือก'}</span><span class="v" ${trA('lens:'+S.lensMode,'lens')}>${fmt(L.res.totalCost)}</span></div>`; }
  return `<div class="a"><span class="lbl">คำตอบ</span><span class="s">ดูรายการด้านล่าง</span></div>`;
}
function drawQ(){
  document.getElementById('qbar')?.remove(); document.getElementById('qmenu')?.remove(); document.getElementById('qstores')?.remove();
  if(S.screen!=='sheet') return; const sh=cur(); if(!sh) return;

#tradeV{padding:16px max(16px,env(safe-area-inset-left,0px));max-width:1100px}

#tradeV .chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}

#tradeV .chips button.on{background:#fdd663;border-color:#fdd663;color:#1f1f1f;font-weight:600}

#tradeV .pt{cursor:pointer}
#tradeV .legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--on-surface-var);margin:8px 0 18px}

#tradeV table{border-collapse:collapse;font-size:13px;width:100%}

#tradeV th,#tradeV td{padding:6px 10px;border-bottom:1px solid var(--outline-var);text-align:right;white-space:nowrap}
#tradeV th:first-child,#tradeV td:first-child{text-align:left}
#tradeV td b{background:color-mix(in srgb,#fdd663 45%,transparent);padding:1px 6px;border-radius:6px}
#tradeTip{position:fixed;z-index:80;background:#1f1f1f;color:#e8eaed;padding:8px 10px;border-radius:8px;font-size:12.5px;pointer-events:none;line-height:1.5;box-shadow:0 4px 14px rgba(0,0,0,.3)}

  const T=tradeData(sh); if(!T.rows.length){ m.innerHTML='<div id="tradeV"><h3>ยังไม่มีมิติคะแนน</h3><div class="sub">เพิ่มมิติที่สองก่อน แล้วกลับมาที่หน้านี้</div></div>'; return; }

  const isT=!!R.dim.tier, yf=isT?tierL:fmtN; const nx=nice(Math.min(...xs)*0.95,Math.max(...xs)*1.03), ny=isT?{lo:0,hi:13,s:1}:nice(0,Math.max(...ys)*1.08); const yt=isT?[0,1,3,6,9,12]:(()=>{const a=[];for(let t=ny.lo;t<=ny.hi+1e-9;t+=ny.s)a.push(t);return a;})();

  let tb='<div class="tw"><table><thead><tr><th>คะแนนต่อเงิน 1,000 บาท</th>'+T.vars.map(v=>`<th>${esc(v.name)}</th>`).join('')+'</tr></thead><tbody>';

   <div class="chips">${chips}</div>${svg}
   <div class="legend"><span><svg width="14" height="14"><circle cx="7" cy="7" r="5" fill="#fdd663" stroke="#7a5c00" stroke-width="2"/></svg>ไม่มีตัวที่ถูกกว่าและดีกว่า</span><span><svg width="14" height="14"><circle cx="7" cy="7" r="5" fill="none" stroke="#777" stroke-width="2"/></svg>มีตัวที่ถูกกว่าและดีกว่า</span><span><svg width="14" height="14"><circle cx="7" cy="7" r="5" fill="none" stroke="#777" stroke-width="2"/></svg>จัดเอง</span><span><svg width="14" height="14"><rect x="2" y="2" width="10" height="10" fill="none" stroke="#777" stroke-width="2"/></svg>ซื้อทั้งชุด</span></div>${tb}</div>`;
  m.querySelectorAll('.chips button').forEach(b=>b.onclick=()=>{ QP.tRow=b.dataset.k; drawTrade(); });
  let tip=document.getElementById('tradeTip'); if(!tip){ tip=document.createElement('div'); tip.id='tradeTip'; tip.hidden=true; document.body.appendChild(tip); }
  m.querySelectorAll('.pt').forEach(el=>{ const p=pts[+el.dataset.i];
    el.onmouseenter=e=>{ tip.innerHTML=`<b>${esc(p.name)}</b>${p.lock?' · ซื้อทั้งชุด':''}<br>${esc(p.cn)}<br>ราคา ${fmtN(p.x)} บาท<br>${esc(isT?R.dim.name:R.row.name)} ${yf(p.y)}<br>${p.domBy.length?'มีตัวที่ถูกกว่าและดีกว่า: '+p.domBy.map(b=>esc(b.name)).join(', '):'ไม่มีตัวที่ถูกกว่าและดีกว่า'}`; tip.hidden=false; };
    el.onmousemove=e=>{ tip.style.left=(e.clientX+14)+'px'; tip.style.top=(e.clientY+14)+'px'; };
    el.onmouseleave=()=>tip.hidden=true; });

<script>
(function(){
const fmtN=n=>Math.round(n).toLocaleString('en-US');
QP.pcSel=QP.pcSel||[];
window.drawPC=function(target){
  const sh=cur(); const m=target||document.getElementById('main'); if(!sh||!m) return;
  const T=window.tradeData(sh);
  if(!T.rows.length){ m.innerHTML='<div id="pcV"><h3>ยังไม่มีมิติคะแนน</h3><div class="how">เพิ่มมิติที่สองก่อน แล้วกลับมาที่หน้านี้</div></div>'; return; }
  // axes: price first (lower = better), then each score row
  const axes=[{key:'price',name:'ราคารวม',short:'ราคา',dir:'min',tier:false,val:v=>T.price[v.id]}]
    .concat(T.rows.map(x=>({key:x.key,name:x.dim.tier?'PSU tier':x.row.name, short:x.dim.tier?'PSU':x.row.name.replace('CPU (หลายคอร์)','CPU หลาย').replace('CPU (คอร์เดียว)','CPU เดี่ยว'),sub:x.dim.tier?'SPL':'PassMark',dir:x.dim.dir,tier:!!x.dim.tier,val:v=>x.vals[v.id]})));
  const vars=T.vars.filter(v=>T.price[v.id]!=null);
  const items=vars.map(v=>({v,name:v.name.replace('🔒 ',''),lock:/🔒/.test(v.name),vals:axes.map(a=>{const z=a.val(v);return z==null?null:z;})}));
  // dominance: b dominates a if on every axis both have, b is at least as good, strictly better on one; need >=2 shared axes
  const better=(a,x,y)=>a.dir==='max'?x>y:x<y;
  items.forEach(a=>{ a.domBy=items.filter(b=>{ if(b===a) return false; let shared=0,strict=false;
    for(let i=0;i<axes.length;i++){ const x=b.vals[i],y=a.vals[i]; if(x==null||y==null) continue; shared++; if(better(axes[i],y,x)) return false; if(better(axes[i],x,y)) strict=true; }
    return shared>=2&&strict; }); });
  QP.pcSel=QP.pcSel.filter(n=>items.find(i=>i.name===n));
  const sel=n=>QP.pcSel.indexOf(n);
  // geometry
  const Wm=m.clientWidth||900, narrow=Wm<640;
  const W=Math.max(340,Math.min(1000,Wm-32)), H=narrow?360:400, L=narrow?18:150, Rr=narrow?18:40, Tt=46, B=40;
  const ax=i=>L+i*(W-L-Rr)/(axes.length-1);
  const sc=axes.map((a,i)=>{ if(a.tier) return {lo:0,hi:13};
    const vs=items.map(it=>it.vals[i]).filter(z=>z!=null); let lo=Math.min(...vs),hi=Math.max(...vs); const pad=(hi-lo||hi||1)*0.08; return {lo:Math.max(0,lo-pad),hi:hi+pad}; });
  const Y=(i,z)=>{ const s=sc[i]; let t=(z-s.lo)/(s.hi-s.lo); if(axes[i].dir==='min') t=1-t; return H-B-t*(H-B-Tt); };
  let g='';
  axes.forEach((a,i)=>{ const x=ax(i);
    g+=`<line class="axl" x1="${x}" x2="${x}" y1="${Tt}" y2="${H-B}"/>`;
    g+=`<text class="axn" x="${x}" y="${Tt-24}" text-anchor="middle">${esc(narrow?a.short:a.name)}</text><text class="axd" x="${x}" y="${Tt-10}" text-anchor="middle">${a.dir==='min'?'บน = ถูกกว่า':'บน = ดีกว่า'}</text>`;
    if(a.tier){ [0,1,3,6,9,12].forEach(k=>g+=`<text class="tk" x="${x-6}" y="${Y(i,k)+4}" text-anchor="end">${tierL(k)}</text>`); }
    else { const s=sc[i]; const top=a.dir==='min'?s.lo:s.hi, bot=a.dir==='min'?s.hi:s.lo;
      if(!narrow){ g+=`<text class="tk" x="${x}" y="${H-B+16}" text-anchor="middle">ล่าง ${fmtN(bot)}</text>`;
      g+=`<text class="tk" x="${x}" y="${H-B+30}" text-anchor="middle">บน ${fmtN(top)}</text>`; } }
  });
  // lines (draw unselected first, selected last)
  const order=items.slice().sort((a,b)=>sel(a.name)-sel(b.name));
  let lines='', vals='';
  order.forEach(it=>{ const k=sel(it.name), cls=(k>=0?'s'+k:'')+(it.domBy.length?' dom':'');
    let segs=[], cur=[];
    it.vals.forEach((z,i)=>{ if(z==null){ if(cur.length) segs.push(cur); cur=[]; } else cur.push([ax(i),Y(i,z)]); });
    if(cur.length) segs.push(cur);
    segs.forEach(sg=>{ const d=sg.map(p=>p.join(',')).join(' ');
      if(sg.length>1) lines+=`<polyline class="ln ${cls}" points="${d}"/><polyline class="hit" data-n="${esc(it.name)}" points="${d}"/>`;
      sg.forEach(p=>{ lines+= it.lock&&p[0]===ax(0)?`<rect x="${p[0]-5}" y="${p[1]-5}" width="10" height="10" class="ln ${cls}" style="stroke-dasharray:none"/>`:`<circle cx="${p[0]}" cy="${p[1]}" r="${k>=0?4.5:3}" class="ln ${cls}" style="stroke-dasharray:none"/>`; }); });
    if(k>=0) it.vals.forEach((z,i)=>{ const x=ax(i);
      if(z==null){ vals+=`<text class="na" x="${x+6}" y="${H-B-6-k*14}">${esc(it.name.slice(0,10))}: ไม่พบ</text>`; return; }
      const txt=axes[i].tier?tierL(z):fmtN(z); const right=i<axes.length-1; vals+=`<text class="val s${k}" x="${right?x+7:x-7}" y="${Y(i,z)+(k?14:-6)}" text-anchor="${right?'start':'end'}">${txt}</text>`; });
  });

  let names='';
  if(!narrow){ const placed=[]; items.slice().sort((a,b)=>Y(0,a.vals[0])-Y(0,b.vals[0])).forEach(it=>{ let y=Y(0,it.vals[0])+4; for(let t=0;t<12;t++){ const hit=placed.find(q=>Math.abs(q-y)<14); if(!hit) break; y=hit+14; } placed.push(y); const k=sel(it.name);
    names+=`<text class="nm ${k>=0?'s'+k:''}" data-n="${esc(it.name)}" x="${L-12}" y="${y}" text-anchor="end">${esc(it.name)}${it.lock?' 🔒':''}</text>`; }); }
  const svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="กราฟแกนขนาน เทียบทุกมิติ">${g}${lines}${vals}${names}</svg>`;
  const nd=items.filter(i=>!i.domBy.length), dd=items.filter(i=>i.domBy.length);
  const opts=items.map(it=>{ const k=sel(it.name); return `<button class="${k>=0?'s'+k:''} ${it.domBy.length?'dom':''}" data-n="${esc(it.name)}">${it.lock?'🔒 ':''}${esc(it.name)}</button>`; }).join('');
  const hasT=axes.some(a=>a.tier);
  m.innerHTML=`<div id="pcV"><h3>เทียบทุกมิติในกราฟเดียว</h3>
   <div class="how">แต่ละเส้นคือหนึ่งตัวเลือก · ทุกแกน <b>ยิ่งสูงยิ่งดี</b> (แกนราคา บน = ถูก) · <b>เส้นตัดกัน = ได้อย่างเสียอย่าง</b> · แตะชื่อเพื่อไฮไลต์ (เลือกได้ 2)</div>
   <div class="opts">${opts}</div>${svg}
   <div class="sub">${dd.length?`<b>${dd.length} ตัวเลือก</b>มีตัวอื่นที่ดีกว่าหรือเท่ากันทุกแกน (เส้นประจาง): `+dd.map(a=>esc(a.name)+' ← '+a.domBy.map(b=>esc(b.name)).join(', ')).join(' · '):'ไม่มีตัวเลือกไหนแพ้ตัวอื่นทุกแกน — ทุกตัวมีจุดที่ได้เปรียบ'}</div>
   <div class="pcsrc">ที่มา: ราคา JIB / ihavecpu (คนใส่จากหน้าร้าน) · CPU/GPU: PassMark${hasT?' · PSU tier: SPL\'s PSU Tier List v2.05 (4 ก.ค. 2026)':''} · ช่อง "ไม่พบ" = ร้านไม่ระบุรุ่น</div></div>`;
  const tog=n=>{ const k=QP.pcSel.indexOf(n); if(k>=0) QP.pcSel.splice(k,1); else { QP.pcSel.push(n); if(QP.pcSel.length>2) QP.pcSel.shift(); } window.drawPC(target); };
  m.querySelectorAll('[data-n]').forEach(el=>el.addEventListener('click',()=>tog(el.dataset.n)));
};
})();
</script>

<script>
(function(){
const fmtN=n=>Math.round(n).toLocaleString('en-US');
const PRESETS={
  game:{label:'🎮 เล่นเกม',strong:'GPU',rules:[{ax:'GPU',min:20000},{ax:'PSU',min:6}]},
  work:{label:'💼 ทำงาน',strong:'CPU (หลายคอร์)',rules:[{ax:'CPU (หลายคอร์)',min:40000},{ax:'PSU',min:6}]},
  general:{label:'🏠 ใช้ทั่วไป',strong:'CPU (คอร์เดียว)',rules:[{ax:'PSU',min:6}]}
};
if(!QP.ask) QP.ask={preset:'game',obj:'price',rules:JSON.parse(JSON.stringify(PRESETS.game.rules)),budget:null};
function pane(){ let p=document.getElementById('askPane'); if(!p){ p=document.createElement('aside'); p.id='askPane'; const w=document.getElementById('work'); w.insertBefore(p,document.getElementById('rail')); } return p; }
window.drawAsk=function(){
  const sh=cur(); const P=pane();
  if(!sh||S.screen!=='sheet'){ P.hidden=true; document.body.classList.remove('askon'); return; }
  const T=window.tradeData(sh);
  const axes=[{id:'price',name:'ราคารวม',dir:'min',val:v=>T.price[v.id]}].concat(T.rows.map(x=>{ const rn=x.row.name==='CPU'?'CPU (หลายคอร์)':x.row.name; return {id:x.dim.tier?'PSU':rn,name:x.dim.tier?'PSU tier':rn,dir:x.dim.dir,tier:!!x.dim.tier,val:v=>x.vals[v.id]}; }));
  if(axes.length<2){ P.hidden=true; document.body.classList.remove('askon'); return; }
  P.hidden=false; document.body.classList.add('askon');
  const Q=QP.ask, pre=PRESETS[Q.preset];
  const vars=T.vars.filter(v=>T.price[v.id]!=null);
  const objAx=Q.obj==='price'?0:axes.findIndex(a=>a.id===pre.strong);
  const near=(i,z,r)=>axes[i].tier?z>=r.min-1:z/r.min>=0.9;
  const rows=vars.map(v=>{ const vals=axes.map(a=>{const z=a.val(v);return z==null?null:z;}); const fails=[],unknown=[];
    Q.rules.forEach(r=>{ const i=axes.findIndex(a=>a.id===r.ax); if(i<0) return; const z=vals[i];
      if(z==null) unknown.push(axes[i].name); else if(z<r.min) fails.push({near:near(i,z,r),txt:axes[i].tier?`PSU ${tierL(z)} ต่ำกว่า ${tierL(r.min)}`:`${axes[i].name} ${fmtN(z)} ขาดอีก ${fmtN(r.min-z)}`}); });
    if(Q.budget!=null&&vals[0]>Q.budget) fails.push({near:vals[0]/Q.budget<=1.1,txt:`เกินงบ ${fmtN(vals[0]-Q.budget)} บาท`});
    const ok=!fails.length&&!unknown.length;
    return {v,name:v.name.replace('🔒 ',''),lock:/🔒/.test(v.name),vals,fails,unknown,ok,near:!ok&&fails.length&&fails.every(f=>f.near)};
  });
  const pass=rows.filter(r=>r.ok).sort((a,b)=>Q.obj==='price'?a.vals[0]-b.vals[0]:b.vals[objAx]-a.vals[objAx]);
  const win=pass[0];
  QP.askWin=win?win.v.id:null;
  const presets=Object.entries(PRESETS).map(([k,p])=>`<button data-preset="${k}" class="${Q.preset===k?'on':''}">${p.label}</button>`).join('');
  const strongName=pre.strong;
  const qtext=Q.obj==='price'?'ตัวไหนถูกที่สุด ที่ยังผ่านเงื่อนไขนี้?':`ตัวไหน ${esc(strongName)} แรงที่สุด ที่ยังผ่านเงื่อนไขนี้?`;
  const tierOpts=sel=>[1,3,6,9,10,12].map(k=>`<option value="${k}" ${k===sel?'selected':''}>${tierL(k)} ขึ้นไป</option>`).join('');
  const rules=Q.rules.map((r,k)=>{ const a=axes.find(x=>x.id===r.ax); if(!a) return '';
    return `<label for="rk${k}">${esc(a.tier?'PSU tier':a.name+' ≥')}</label>${a.tier?`<select id="rk${k}" data-rk="${k}">${tierOpts(r.min)}</select>`:`<input id="rk${k}" type="number" step="1000" data-rk="${k}" value="${r.min}">`}`; }).join('')
    +`<label for="bgt">งบไม่เกิน</label><input id="bgt" type="number" step="1000" data-budget value="${Q.budget==null?'':Q.budget}" placeholder="ไม่จำกัด">`;
  const val=(r)=>Q.obj==='price'?fmtN(r.vals[0])+' บาท':(r.vals[objAx]==null?'—':fmtN(r.vals[objAx]));
  const order=pass.concat(rows.filter(r=>r.near),rows.filter(r=>!r.ok&&!r.near));
  QP.askOrd=order.map(r=>r.v.id);
  QP.askEval={}; QP.askRules=[];
  const cls=(i,z,min)=>{ const a=axes[i]; if(a.tier) return z>=min+2?'ok':z>=min-1?'mid':'bad'; const q=z/min; return q>=1.1?'ok':q>=0.9?'mid':'bad'; };
  Q.rules.forEach(rule=>{ const i=axes.findIndex(a=>a.id===rule.ax); if(i<0) return; const a=axes[i];
    QP.askRules.push({ax:a.id,label:(a.tier?'PSU ≥ '+tierL(rule.min):'≥ '+fmtN(rule.min))});
    order.forEach(r=>{ const z=r.vals[i]; const e=(QP.askEval[r.v.id]=QP.askEval[r.v.id]||{});
      e[a.id]=z==null?{s:'na',t:'ไม่พบ'}:{s:cls(i,z,rule.min),fail:z<rule.min,t:(a.tier?tierL(z):fmtN(z))+(z<rule.min?' ✕':' ✓')}; }); });
  if(Q.budget!=null) order.forEach(r=>{ const z=r.vals[0]; const q=z/Q.budget; (QP.askEval[r.v.id]=QP.askEval[r.v.id]||{}).budget={s:q<=0.9?'ok':q<=1.1?'mid':'bad',fail:z>Q.budget,t:z>Q.budget?'เกินงบ '+fmtN(z-Q.budget):'อยู่ในงบ ✓'}; });
  const list=order.map(r=>{ const st=r===win?['✅','ok','คำตอบ']:r.ok?['✓','ok','ผ่าน']:r.near?['⚠️','mid','เกือบผ่าน · '+r.fails.map(f=>f.txt).join(', ')]:r.fails.length?['✕','bad',r.fails.map(f=>f.txt).join(', ')]:['?','bad','ร้านไม่ระบุ '+r.unknown.join(', ')];
    const extra=r.unknown.length&&r.fails.length?' · ไม่พบ '+r.unknown.join(', '):'';
    const ev=QP.askEval[r.v.id]||{};
    const chips=Object.entries(ev).map(([k,e])=>`<span class="mc ${e.s}${e.fail?' f':''}">${esc(k==='budget'?'งบ':k==='PSU'?'PSU':k.replace('CPU (หลายคอร์)','CPU').replace('CPU (คอร์เดียว)','CPU 1 คอร์'))} ${esc(e.t)}</span>`).join('');
    const parts=sh.rows.filter(x=>x.type==='item'&&x.name!=='CPU (คอร์เดียว)'&&x.names&&x.names[r.v.id]).map(x=>{ const pv=sh.curDim==='price'?parse((x.rawData||{})[r.v.id]):null; return `<li><b>${esc(x.name)}</b> ${esc(x.names[r.v.id])}${pv&&isValid(pv)&&pv.value>0?' · '+fmtN(pv.value):''}</li>`; }).join('');
    return `<div class="it ${st[1]}"><span class="ic">${st[0]}</span><span class="nm">${r.lock?'🔒 ':''}${esc(r.name)}</span><span class="pr">${val(r)}</span><span class="why">${esc(st[2]+extra)}</span><div class="mobx">${chips?`<div class="mcs">${chips}</div>`:''}<details><summary>ดูชิ้นส่วน</summary><ul>${parts}</ul></details></div></div>`; }).join('');
  const ans=win?`<div class="ans"><div class="lab">คำตอบ · ผ่าน ${pass.length} จาก ${rows.length}</div><div class="big">${win.lock?'🔒 ':''}${esc(win.name)}<b>${val(win)}</b></div></div>`
               :`<div class="ans none"><div class="lab">คำตอบ</div><div class="big">ไม่มีตัวที่ผ่านทุกเงื่อนไข</div><div class="note">ลองลดเงื่อนไขลง หรือดูตัวที่ "เกือบผ่าน" ด้านล่าง</div></div>`;
  P.innerHTML=`<h4>ใช้ทำอะไร</h4><div class="presets">${presets}</div>
    <h4>คำถาม</h4><div class="objs"><button data-obj="price" class="${Q.obj==='price'?'on':''}">ถูกที่สุด</button><button data-obj="strong" class="${Q.obj!=='price'?'on':''}">${esc(strongName)} แรงที่สุด</button></div>
    <div class="q">${qtext}</div>
    <div class="rules">${rules}</div>
    <div class="note">ค่าตั้งต้นของหมวดเป็นจุดเริ่ม แก้ตัวเลขได้ · แอปไม่เลือกแทน แค่หาตัวที่ตรงเงื่อนไข</div>
    ${ans}
    <div class="list">${list}</div>
    <div class="src">ที่มา: ราคา JIB / ihavecpu (คนใส่จากหน้าร้าน) · CPU/GPU: PassMark · PSU tier: SPL's PSU Tier List v2.05 (4 ก.ค. 2026)</div>
    <div class="aipack"><button data-aipack>🤖 ส่งให้ AI ช่วยอธิบาย</button><div class="note">คัดลอกชุดความรู้ + ข้อมูลในชีต + คำถามนี้ ไปวางใน AI ตัวไหนก็ได้ AI จะอธิบายตามข้อมูลนี้เท่านั้น และไม่เลือกแทน</div><textarea data-aitext readonly hidden></textarea></div>`;
  const re=()=>{ window.drawAsk(); markCol(); };
  P.querySelectorAll('[data-preset]').forEach(b=>b.onclick=()=>{ const p=PRESETS[b.dataset.preset]; QP.ask={preset:b.dataset.preset,obj:Q.obj,rules:JSON.parse(JSON.stringify(p.rules)),budget:Q.budget}; re(); });
  P.querySelectorAll('[data-obj]').forEach(b=>b.onclick=()=>{ Q.obj=b.dataset.obj==='price'?'price':'strong'; re(); });
  P.querySelectorAll('[data-rk]').forEach(el=>el.onchange=e=>{ const v=Number(e.target.value); if(isFinite(v)) Q.rules[+el.dataset.rk].min=v; re(); });
  P.querySelector('[data-budget]').onchange=e=>{ const v=e.target.value.trim(); Q.budget=v===''?null:Number(v); re(); };
  P.querySelector('[data-aipack]').onclick=async()=>{
    const fmtV=(a,z)=>z==null?'ไม่พบ (null)':a.tier?tierL(z):fmtN(z);
    const lines=rows.map(r=>'- '+r.name+(r.lock?' [คอมเซ็ต ซื้อแยกไม่ได้]':'')+': '+axes.map((a,i)=>a.name+' = '+fmtV(a,r.vals[i])).join(' · ')
      +' | ชิ้นส่วน: '+sh.rows.filter(x=>x.type==='item'&&x.name!=='CPU (คอร์เดียว)'&&x.names&&x.names[r.v.id]).map(x=>x.name+' '+x.names[r.v.id]).join(', ')
      +' | ผลตามเงื่อนไข: '+(r===win?'คำตอบ':r.ok?'ผ่าน':r.near?'เกือบผ่าน':r.fails.length?'ไม่ผ่าน':'ข้อมูลไม่พอ')+(r.fails.length?' ('+r.fails.map(f=>f.txt).join(', ')+')':'')+(r.unknown.length?' (ไม่พบ '+r.unknown.join(', ')+')':''));
    const cond=Q.rules.map(r=>{ const a=axes.find(x=>x.id===r.ax); return a?(a.tier?'PSU tier ≥ '+tierL(r.min):a.name+' ≥ '+fmtN(r.min)):''; }).filter(Boolean).concat(Q.budget!=null?['งบ ≤ '+fmtN(Q.budget)+' บาท']:[]).join(', ')||'ไม่มี';
    const txt=`คุณคือผู้ช่วยอธิบายการเลือกซื้อคอมพิวเตอร์ (PC) ที่ทำงานร่วมกับแอป PriceCom
หน้าที่: อธิบาย trade-off ให้คนที่ไม่รู้เรื่องคอมเข้าใจ — ไม่ใช่เลือกแทน

กฎ (ต้องทำตามทุกข้อ)
1. ใช้เฉพาะข้อมูลในหัวข้อ "ข้อมูล" ด้านล่าง ห้ามใช้ราคา/คะแนนจากความจำของคุณ ถ้าข้อมูลไม่มี ให้พูดว่า "ไม่พบในข้อมูล" ห้ามเดา
2. ห้ามบอกว่า "ควรซื้อเครื่องไหน" ให้บอกว่า "ถ้าให้ความสำคัญกับ X → เครื่อง A เพราะ… · ถ้าให้ความสำคัญกับ Y → เครื่อง B เพราะ…"
3. ทุกตัวเลขที่ยกมา ต้องบอกแหล่ง (ราคา = หน้าร้าน, CPU/GPU = PassMark, PSU = SPL tier)
4. ถ้าผู้ใช้ไม่ได้บอกการใช้งานหรืองบ ให้ถามกลับก่อน 1 คำถาม
5. ภาษาง่าย ไม่เกิน 10 บรรทัด ศัพท์เทคนิคต้องอธิบายในวงเล็บ

ความรู้ที่ต้องใช้ตีความ
- CPU หลายคอร์ (PassMark CPU Mark): งานตัดต่อ เรนเดอร์ เปิดหลายโปรแกรม
- CPU คอร์เดียว (PassMark Single Thread): เกมส่วนใหญ่และงานทั่วไปพึ่งค่านี้มากกว่า
- GPU (PassMark G3D): สำคัญที่สุดสำหรับเกม
- PSU tier (SPL's PSU Tier List v2.05): A ดีสุด → F แย่สุด จัดจากผลทดสอบไฟจริง (ripple, ระบบป้องกัน, ประกัน) ไม่ใช่จากวัตต์หรือป้าย 80+ · E = คุณภาพต่ำแต่ยังไม่อันตรายถึงระดับ F · คอมเซ็ตมักไม่ระบุรุ่น PSU จึงประเมินไม่ได้
- คอมเซ็ต (🔒) ซื้อแยกชิ้นไม่ได้ แต่มักได้ความสะดวก/ประกันทั้งชุด
- ไม่ได้วัดในข้อมูลนี้: ประกัน, ความเข้ากันได้ของชิ้นส่วน, เสียงและความร้อน, FPS จริงในเกม, ความสวย — ถ้าผู้ใช้ถามเรื่องเหล่านี้ ให้บอกว่าแอปไม่ได้วัด

คำถามของผู้ใช้ตอนนี้
- ใช้ทำอะไร: ${PRESETS[Q.preset].label.replace(/^\S+ /,'')}
- คำถาม: ${qtext.replace(/<[^>]+>/g,'')}
- เงื่อนไข: ${cond}
- แอปคำนวณได้ว่า: ${win?win.name+' ('+val(win)+')':'ไม่มีตัวที่ผ่านทุกเงื่อนไข'}

ข้อมูล (จากชีต "${sh.name}")
${lines.join('\n')}

    const ta=P.querySelector('[data-aitext]'); ta.value=txt; ta.hidden=false; ta.select();
    let ok=false; try{ await navigator.clipboard.writeText(txt); ok=true; }catch(_){ try{ ok=document.execCommand('copy'); }catch(__){} }
    P.querySelector('[data-aipack]').textContent=ok?'✅ คัดลอกแล้ว — ไปวางใน AI ได้เลย':'เลือกข้อความด้านล่างแล้วกดคัดลอกเอง';
  };
};
function markCol(){
  const m=document.getElementById('main'); const t=m&&m.querySelector('table.sg'); const sh=cur();
  if(!t||!sh) return;
  t.querySelectorAll('.askcol').forEach(el=>el.classList.remove('askcol'));
  t.querySelectorAll('.askchip').forEach(el=>el.remove());
  t.querySelectorAll('.ask-ok,.ask-mid,.ask-bad,.ask-na,.ask-fail,.askrow').forEach(el=>el.classList.remove('ask-ok','ask-mid','ask-bad','ask-na','ask-fail','askrow'));
  if(!QP.askWin&&!QP.askOrd||!document.body.classList.contains('askon')||S.view!=='table') return;
  const V=sh.variables.length;
  // tag data cells with their var id once (original order), then reorder by QP.askOrd
  t.querySelectorAll('tr').forEach(tr=>{ const cells=[...tr.children]; if(cells.length<V+1) return;
    if(!tr.dataset.askTagged){ sh.variables.forEach((v,k)=>{ cells[k+1].dataset.askv=v.id; }); tr.dataset.askTagged='1'; }
    const first=cells[0], data=cells.filter(c=>c.dataset.askv), rest=cells.slice(1).filter(c=>!c.dataset.askv);
    const by={}; data.forEach(c=>by[c.dataset.askv]=c);
    const ord=(QP.askOrd||[]).filter(id=>by[id]).concat(data.map(c=>c.dataset.askv).filter(id=>!(QP.askOrd||[]).includes(id)));
    tr.append(first,...ord.map(id=>by[id]),...rest);
    const win=QP.askWin&&by[QP.askWin]; if(win) win.classList.add('askcol'); });
  // condition rows
  const ROW={'GPU':'GPU','CPU':'CPU (หลายคอร์)','CPU (หลายคอร์)':'CPU (หลายคอร์)','CPU (คอร์เดียว)':'CPU (คอร์เดียว)','PSU':'PSU'};
  const rules=QP.askRules||[], E=QP.askEval||{};
  t.querySelectorAll('tbody tr').forEach(tr=>{ const nameCell=tr.children[0]; const nm=(nameCell.innerText||'').split('\n')[0].trim(); const ax=ROW[nm];
    const rule=ax&&rules.find(r=>r.ax===ax); if(!rule) return;
    nameCell.classList.add('askrow'); const lab=document.createElement('span'); lab.className='askchip rowlab'; lab.textContent='เงื่อนไข '+rule.label; nameCell.appendChild(lab);
    [...tr.children].forEach(c=>{ const e=c.dataset.askv&&E[c.dataset.askv]&&E[c.dataset.askv][ax]; if(!e) return;
      c.classList.add('ask-'+e.s); if(e.fail) c.classList.add('ask-fail');
      const chip=document.createElement('span'); chip.className='askchip'; chip.textContent=(ax==='PSU'?'PSU ':ax.startsWith('CPU')?'PassMark ':'G3D ')+e.t; c.appendChild(chip); }); });
  // budget on header totals
  t.querySelectorAll('thead th').forEach(c=>{ const e=c.dataset.askv&&E[c.dataset.askv]&&E[c.dataset.askv].budget; if(!e) return;
    c.classList.add('ask-'+e.s); if(e.fail) c.classList.add('ask-fail'); const chip=document.createElement('span'); chip.className='askchip'; chip.textContent=e.t; c.appendChild(chip); });
  if(QP.askScrolled!==QP.askWin){ QP.askScrolled=QP.askWin; const h=t.querySelector('.askcol'); if(h) setTimeout(()=>h.scrollIntoView({block:'nearest',inline:'center'}),0); }
}
window.markAskCol=markCol;
function mobSwitch(){ let m=document.getElementById('mobSwitch'); if(!m){ m=document.createElement('div'); m.id='mobSwitch'; m.innerHTML='<button data-m="ask">ถาม-ตอบ</button><button data-m="tbl">ตารางเต็ม</button>'; document.body.appendChild(m);
  m.querySelectorAll('button').forEach(b=>b.onclick=()=>{ document.body.classList.toggle('mobtable',b.dataset.m==='tbl'); upd(); window.scrollTo(0,0); if(b.dataset.m==='tbl'&&window.markAskCol) window.markAskCol(); }); }
  const upd=()=>m.querySelectorAll('button').forEach(b=>b.classList.toggle('on',(b.dataset.m==='tbl')===document.body.classList.contains('mobtable'))); upd(); }
window.mobSwitch=mobSwitch;
})();

const jib=q=>'https://www.jib.co.th/web/product/product_search/0/?str_search='+encodeURIComponent(q);
function clean(n){ return String(n||'').split('+')[0].replace(/\([^)]*\)/g,'').replace(/·.*$/,'').replace(/\s+/g,' ').trim(); }
function generic(n){ return !n||/ไม่ระบุ|แถม|^\d+\s*W\b/i.test(n); }
function links(row,name){
  if(/ราคาทั้งชุด|คอร์เดียว/.test(row)) return '';
  const n=clean(name); if(generic(n)) return '';
  const a=[['🛒 JIB',jib(n)]];
  if(row==='CPU') a.push(['📊 PassMark',g('site:cpubenchmark.net '+n)]);
  else if(row==='GPU') a.push(['📊 PassMark',g('site:videocardbenchmark.net '+n)]);
  else if(row==='PSU') a.push(['🏷 SPL tier',SPL]);
  a.push(['🔎 รีวิว',g(n+' review')]);
  return '<span class="xl">'+a.map(x=>`<a href="${x[1]}" target="_blank" rel="noopener" title="เปิดในแท็บใหม่ — ข้อมูลนอกแอป ตรวจเองก่อนเชื่อ">${x[0]}</a>`).join('')+'</span>';

function findFact(name){ return F.findIndex(x=>x.re.test(name||'')); }
window.PC_FACTS=F;
function modal(){ let m=document.getElementById('factM'); if(m) return m;
  m=document.createElement('div'); m.id='factM'; m.innerHTML='<div class="box" role="dialog" aria-modal="true"></div>'; document.body.appendChild(m);
  m.addEventListener('click',e=>{ if(e.target===m||e.target.closest('.x')) m.classList.remove('on'); });
  document.addEventListener('keydown',e=>{ if(e.key==='Escape') m.classList.remove('on'); });
  return m; }
function show(i){ const x=F[i]; const m=modal();
  m.querySelector('.box').innerHTML=`<button class="x" aria-label="ปิด">×</button><h3>📋 ${x.t}</h3><div class="st">${FACT_STATUS}</div>${x.cav?`<div class="cav">⚠ ${x.cav}</div>`:''}<ul>${x.f.map(f=>`<li>${f[0]}<a href="${U[f[1]][1]}" target="_blank" rel="noopener">[${U[f[1]][0]}]</a></li>`).join('')}</ul>`;
  m.classList.add('on'); }
function addChips(root){
  root.querySelectorAll('.xl').forEach(el=>{
    if(el.querySelector('.fx')) return;
    const host=el.closest('td,li'); if(!host) return;
    let name='';
    if(host.tagName==='TD'){ const [,rid,vid]=(host.dataset.trace||'').split(':'); const r=cur()&&cur().rows.find(x=>x.id===rid); name=r&&r.names?r.names[vid]:''; }
    else { const b=host.querySelector('b'); name=host.textContent.slice(b?b.textContent.length:0); }
    const i=findFact(name); if(i<0) return;
    el.insertAdjacentHTML('afterbegin',`<a href="#" class="fx" data-fact="${i}" title="ข้อเท็จจริงที่ตรวจกับแหล่งแล้ว">📋 ${F[i].f.length} ข้อ</a>`);
  });
}
document.addEventListener('click',e=>{ const a=e.target.closest&&e.target.closest('a.fx'); if(!a) return; e.preventDefault(); e.stopPropagation(); show(+a.dataset.fact); },true);
const oR=window.renderAll; window.renderAll=function(){ const r=oR.apply(this,arguments); try{addChips(document);}catch(e){console.warn(e);} return r; };
const oA=window.drawAsk; if(oA) window.drawAsk=function(){ const r=oA.apply(this,arguments); try{addChips(document);}catch(e){console.warn(e);} return r; };
try{addChips(document);}catch(e){}
})();
